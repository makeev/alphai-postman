openapi: 3.1.0
info:
  title: AlphAI REST API
  version: "1.61.0"
  description: |
    Public REST API for AlphAI's relevance-scored, ticker-linked financial news.
    All endpoints accept `Authorization: Bearer ak_live_…` (issued from your
    `/account/api-keys`). Authenticated traffic is metered per account with two
    layers — a per-minute burst cap and a per-day volume cap (Free 20/min +
    100/day, Basic 60/min + 10,000/day, Pro 150/min + 100,000/day); a request
    passes only if both are under budget. The Free tier is for evaluation /
    personal non-commercial use; Basic is licensed for internal commercial use;
    Pro adds redistribution of the enriched feed. Send all API traffic to
    `api.alphai.io`; a key is required on every request.

    The API is server-side only. It sends no CORS headers, so a cross-origin
    call from a browser page fails at the preflight: the `OPTIONS` request is
    answered with `403` at the edge and never reaches the API. Keep the key on
    your server and expose your own route to the browser; a key embedded in
    page code is readable by every visitor and spends your quota.

    Every keyed response carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`
    and `X-RateLimit-Reset`; these report the per-day volume layer (Reset =
    epoch seconds of the next 00:00 UTC reset) so you can watch your daily budget
    without provoking a 429. A per-minute burst surfaces only as a 429 with a
    short `Retry-After`. A 429 body also names your tier, its caps and an
    `upgrade` block. A request rejected with 429 does not itself spend quota.
    The headers reflect origin processing, so a response served from a shared
    cache may omit them.

    On the MCP server (`mcp.alphai.io`) the same two layers meter **tool calls
    only** — the connect handshake (`initialize`, `tools/list`, notifications,
    keepalives, the SSE stream) is protocol traffic and does not consume your
    quota. It carries a separate, far larger ceiling that exists only to stop a
    client reconnecting in a loop; hitting it returns a 429 whose body reports
    `"window": "transport"`, which means your client is reconnecting too often,
    not that you are out of quota.

    MCP news tools accept `detail="compact"` for headline triage and polling:
    `alphai_news_search`, `alphai_ticker_news`, `alphai_insider_news`,
    `alphai_trending`, `alphai_actionable_now`, `alphai_macro` and
    `alphai_pair_analysis`. Compact items keep identity, source, publication
    and ingest times, tickers, category, relevance_score, top-level
    actionability and information_novelty, story fields, ownership_form and
    search_match. Summary, analysis, images and SEC detail blocks are omitted;
    fetch `alphai_article(uid)` for those details. `detail="full"` is the
    default and preserves the existing format, including the condensed recent
    lists on pair_analysis. Selection, order, cursors, query interpretation
    and macro releases are unchanged, so detail can change between pages.
    This parameter belongs to MCP tools only; REST parameters are unchanged.

    Interactive MCP clients use a separate OAuth approval flow. Check the
    callback host or app scheme and full callback address before approving;
    app names are self-declared, not verified by AlphAI. MCP access includes
    news, market data and the saved watchlist, plus creating, changing and
    disabling the user's own alerts on Basic or Pro (including after an
    upgrade). The OAuth scope `tools.read` is not a read-only restriction.
    Registered callbacks can be reviewed in Account → MCP connections.
    That account management surface requires website login, not an API key.
    Disconnect blocks all existing MCP OAuth access and refresh tokens for that
    app connection, including its other sessions; work already in progress may
    finish. Other connections and API keys are unaffected. Revoking either token
    type through the separate MCP host's `/oauth/revoke` has the same effect.
    Serialize refresh requests and save each replacement token: reuse ends the
    connection. MCP `/oauth/token` returns HTTP 400 with `error: invalid_grant`
    and an `error_description` for expired, revoked or reused credentials;
    restart authorization instead of retrying the same credential. A backing-store
    outage returns 503 with Retry-After; retry later without treating it as revocation.

    News-archive depth is tiered: Free keys can page the feeds back 30 days,
    Basic 90 days, Pro 180 days. Paging past your horizon returns `403`
    with an `extra.reason` of `archive_horizon` (see the ArchiveGated response).
    Coverage note: our collectors expanded in June 2026, so archive months
    before 2026-06 hold fewer articles per day than the current feed.

    Insider data (SEC EDGAR Form 4) flows through the same news shape:
    `category=insider` rows in the feed, a dedicated `/api/news/insider/`
    route, and 30-day per-ticker rollups at
    `/api/symbols/{ticker}/insider-summary/`. For charts and analysis there
    is `/api/symbols/{ticker}/insider-trades/`: the complete per-ticker
    event history with 3m/12m/all-time rollups, weekly and monthly dollar
    buckets, and every event of the trailing 12 months in one response.
    Both rollups count a co-filed block once: when the direct holder and
    each affiliated beneficial owner file their own Form 4 for the same
    trade, the dollars and counts carry it once, and the trades history
    marks the other filings with `duplicate_of`.

    Market-wide macro coverage (central-bank decisions, CPI/jobs prints,
    commodities, geopolitics) is in the feed too, under the `macro_economy`,
    `commodities` and `geopolitics` categories and a dedicated
    `/api/news/macro/` route. Macro rows are market-wide events, so most
    carry an empty `tickers` list — filter them by category, not by symbol.

    The forward half of the macro loop is `/api/calendar/`: the official
    schedule of upcoming US macro releases (FOMC decisions and minutes, CPI,
    PPI, jobs report, GDP estimates, PCE, retail sales, jobless claims,
    JOLTS), each with a stable occurrence `uid` that survives reschedules.
    Ask the calendar what's coming, then read `/api/news/macro/` for what a
    release meant once it's out.

    Stories are the feed read one level up: coverage of one event by two or
    more publishers, grouped at ingest and summarised from the articles
    themselves — what happened, the figures with the publisher each came
    from, why it matters, the per-ticker read and the open questions.
    `/api/stories/top/` ranks the last 48 hours, `/api/stories/` pages them
    newest-first, `/api/stories/{story_id}/` is one story with its summary
    and `/api/stories/{story_id}/materials/` lists every article behind it.
    The `story_id` on every article row (the feeds, search, trending, and the
    MCP tools) is the same key: an article's `story_id` opens its story.
    Summaries are AI-generated financial information for research, not
    investment advice.

    Source links. An article's `url` is where its text can be read, usually
    the publisher's own page. PR Newswire releases (`source_domain`
    `prnewswire.com`) are licensed to AlphAI, and their `url` is the release's
    permanent page on alphai.io (`https://alphai.io/news/prnewswire/{id}`). That
    page carries the full original text with attribution to PR Newswire; the API
    itself never returns it. The same page is the link wherever the release
    appears, including story materials and Radar evidence. When PR Newswire
    withdraws a release, it drops out of the feeds and search without a separate
    event, and `/api/news/{uid}/` answers 404 with `redirect_to` set to the page,
    which then shows a short notice instead of the text.

    Bloomberg rows (`source_domain` `bloomberg.com`) come from Bloomberg's public
    headline feeds: the `title` ends with ", Bloomberg reports", the `summary` is
    AlphAI's own one-sentence restatement of the item (or the attributed headline
    itself when no restatement passed our checks), and the analysis is drawn from
    the headline and that sentence, never from the article. Their `url` is the
    Bloomberg article, which requires a Bloomberg subscription to read.

    Query parameters are validated strictly. An unknown or misspelled
    parameter returns 400 naming the field, and the error body carries
    `extra.allowed_params` — every parameter that endpoint accepts — so you
    never have to guess. The two most common spellings are simply accepted:
    `limit` is an alias of `page_size` and `ticker` an alias of `symbol` on
    the news feeds (same names the MCP tools use; sending both spellings of
    one parameter in a single request is still a 400). Other mix-ups get a
    did-you-mean (`per_page` points to `page_size`; `offset`, `page`, `skip`
    and the `after_id`/`before_id` family point to `cursor`). Parameters that
    belong to the MCP server rather than to this API — free-text
    `q`/`query`/`search`, and `min_actionability` — say so instead of failing
    silently.

    See https://alphai.io/developers for the score and sentiment legend, and
    https://alphai.io/pricing for tier limits.
  contact:
    name: alphai support
    email: support@alphai.io
    url: https://alphai.io/contact
  license:
    name: Proprietary

servers:
  - url: https://api.alphai.io
    description: Production (API host — key required)

security:
  - apiKey: []

tags:
  - name: news
    description: Relevance-scored, ticker-linked news.
  - name: stories
    description: Market events covered by two or more publishers, summarised from their sources.
  - name: symbols
    description: Active equity, crypto, and foreign symbols (tickers).
  - name: calendar
    description: Scheduled US macro releases (FOMC, CPI, jobs, GDP, PCE…).

  - name: radar
    description: Descriptive news activity and supporting headlines.
  - name: coverage
    description: What each data source holds — from when, how dense, with which caveats.

paths:
  /api/news/:
    get:
      tags: [news]
      summary: List news (cursor-paginated)
      description: |
        Feed of enriched articles, newest first. Default filter:
        `relevance_score >= 4` AND at least one active ticker. Pagination is
        cursor-based with a default page size of 10 (any size from 1 to 20 via
        `page_size=`; Pro keys go up to 50): omit `cursor` for the newest page,
        then pass the
        `next_cursor` from each response to fetch the next (older) page.
        `next_cursor: null` means the end of the feed. Cursors are opaque — do
        not construct or parse them; an invalid cursor returns 400. Archive
        depth is tiered: paging back past your plan's horizon (Free 30 days,
        Basic 90, Pro 180) returns 403 with an upgrade hint.

        **Delta polling** (`sort=ingested`): the same feed ordered by the
        moment rows became available, for "what is new since my last poll".
        Articles reach the feed later than their publish time (general news in
        the week of 2026-10-19: median ~20 min, three quarters within an hour,
        about one in ten after 3 hours or more), so a poller that
        filters by `time_published` misses most late arrivals; `sort=ingested`
        follows ingest order. First call without `cursor` returns a bounded
        sample of up to `page_size` recent visible rows and a cursor at the
        feed head. This initial sample may be partial or empty when the scan
        reaches its work limit; it still starts the live stream. Each later call with
        the previous `next_cursor` returns only rows added since. In this mode
        `next_cursor` is always non-null — empty `results` means you are
        caught up, keep the cursor and poll again later (responses are cached
        for 60 s, so polling more often than once a minute buys nothing). An
        empty page still counts as one request against your daily quota, and
        enrichment lands in batches, so a fixed-interval poller spends about
        half its calls on empty pages: back off after an empty page (double
        the wait, up to ~15 minutes, and reset on a non-empty one). On Free
        (100 requests/day, 20 rows/page) pair delta mode with a filter such as
        `min_relevance=8` or `symbol` — the unfiltered stream passes ~100 rows
        an hour above the default floor and does not fit a page between polls.
        New rows only: an update to an already-delivered article is not re-sent,
        and a withdrawn PR Newswire release is not announced: it simply stops
        appearing.
        `time_published` is not monotonic within a delta page; sort client-side
        if you need chronological order. A cursor is only valid with the sort
        mode that issued it.

        On resumed requests, empty **successful** pages mean the current scan is caught up. A
        nonempty page shorter than `page_size` may still have a continuation;
        keep following its cursor. If a bounded scan cannot produce a page,
        HTTP 409 reports `extra.reason="delta_scan_incomplete"` and
        `extra.next_cursor`. Continue from that cursor with identical filters
        and sort; repeating the original request cannot resolve this work limit.
        A concurrent change during reading instead returns HTTP 503 with
        `extra.reason="delta_candidates_changed"`: retry the original request,
        without advancing its cursor. Neither error is cached. MCP delta tools
        report the same JSON envelopes as tool errors. The cursor family,
        archive gates and story-collapse behavior remain unchanged.

        Delta mode carries live coverage only: when we add history in bulk
        (backfilling an earlier period), those rows do NOT enter this stream —
        they would arrive as thousands of "new" items that are months old and
        push your cursor far behind the live feed. They are served normally in
        `sort=published`, by date filters and by `/api/news/{uid}/`, so a
        one-off catch-up over the archive is a published-mode query.

        **Keeping up.** One call returns at most `page_size` rows, so a poller
        holds its position at the head only while `calls per day × page_size`
        stays above the daily volume of the stream it asked for. Below that it
        falls a little further behind every day, and the symptom misleads:
        `time_published` reads hours or days old while the data is current.
        What went stale is the cursor, not the feed. So drain instead of
        polling once per tick: when a page comes back with `results` filled,
        call again immediately, and sleep only once `results` is empty. That
        clears a burst within the same cycle and lets a poller catch up by
        itself after downtime. Two levers if the call budget is still short,
        and they multiply: `page_size` (up to 20, or 50 on a Pro key) and a
        narrower stream (`min_relevance`, `symbol`, `category`). For scale, at
        the default `>= 4` floor the feed carries roughly 2,700 rows a day,
        while `min_relevance=7` carries roughly 1,000.

        A poller that never catches up eventually meets the archive gate: the
        403 below is keyed on the age of the first row you have not read yet,
        so it fires on a delta poller that never paged back at all.
      parameters:
        - in: query
          name: cursor
          description: Opaque cursor from a prior response's `next_cursor`. Omit for the newest page.
          schema: { type: string }
        - in: query
          name: symbol
          description: >-
            Filter to articles that mention this ticker. US equities use the
            bare symbol (`NVDA`); cryptocurrencies use the `<SYM>-USD` form
            (`BTC-USD`), and a bare crypto name resolves to it (`DOGE` matches
            `DOGE-USD`); foreign listings use the Yahoo suffix (`VOD.L`). A
            delisted symbol returns its news history. A renamed company's
            current ticker also matches articles tagged with its former
            ticker, and any share class of an issuer matches articles tagged
            with its other listed classes (`GOOGL` includes rows tagged
            `GOOG`); article tags stay as published. `ticker` is accepted as
            an alias.
          schema: { type: string, example: "NVDA" }
        - in: query
          name: category
          description: >-
            Keep only these categories. Accepts a single value, a CSV list
            (`category=earnings,insider`), or a repeated parameter — matches
            any of them (OR).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/NewsCategory" }
        - in: query
          name: exclude_categories
          description: >-
            Drop these categories from the feed. Same single / CSV / repeated
            forms as `category`.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/NewsCategory" }
        - in: query
          name: min_relevance
          description: >-
            Relevance floor, `1`-`10`. The default `4` leaves out low-relevance
            articles; `1`-`3` includes them, `7` and up keeps the strongest.
          schema: { type: integer, minimum: 1, maximum: 10, default: 4 }
        - in: query
          name: page_size
          description: >-
            Items per page, default `10`. Any value from `1` to `20` is accepted
            on every tier; `21`-`50` requires a Pro key. A value outside `1`-`50`,
            or an over-`20` page without a Pro key, returns 400 — the page is
            never silently clamped. Pagination is otherwise unchanged: pass each
            response's `next_cursor` back as `cursor` regardless of page size.
            `limit` is accepted as an alias.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: collapse
          description: >-
            `story` collapses coverage of one event to a single representative
            row (the story root): syndicated reprints and independently written
            articles about the same event, matched on headline and lead
            similarity. Populates the `story_id`, `sources_count` and `sources`
            fields on each item. Omit for the full feed (every article, story
            fields `null`). Only `story` is accepted; any other value returns
            400.

            Note: row-level filters (`symbol`, `category`, `min_relevance`)
            apply to the story's representative root, so a story whose root does
            not match the filter is omitted entirely. The root is the best
            copy the enricher has seen: a later copy that outscores a weak root
            (one below 7) takes the root over, so a story's `story_id` and its
            place in the feed can move once to that copy; a root at 7 or above
            is never replaced. An 8-K that carries a press release as its
            exhibit is a member of that release's story (same issuer, the
            release's headline inside the filing, within 3 hours) when the
            release itself scores at or above the feed floor, so with
            `source_type=sec_form8k` a collapsed feed omits such filings —
            read them uncollapsed. A filing whose release scored below the
            floor stays its own story.
          schema: { type: string, enum: [story] }
        - in: query
          name: collapse_stories
          description: >-
            Boolean alias matching the MCP and Python SDK option. `true` is
            equivalent to `collapse=story`; `false` leaves articles ungrouped.
            Send either `collapse` or `collapse_stories`, not both (400).
          schema: { type: boolean, default: false }
        - in: query
          name: sort
          description: >-
            `published` (default) is the reverse-chronological feed.
            `ingested` is delta-polling mode: rows in the order they became
            available, ascending, with `next_cursor` always returned (empty
            `results` = caught up) — see the endpoint description. All other
            filters apply unchanged in both modes. Cursors are mode-specific:
            a cursor is only valid with the sort mode that issued it (a
            mismatch returns 400).
          schema: { type: string, enum: [published, ingested], default: published }
        - in: query
          name: from_date
          description: >-
            Inclusive lower bound on `time_published` — when the article was
            published, not when it entered the feed. ISO-8601; a value without
            a timezone is read as UTC. A bare date (`2026-06-01`) means that
            day's midnight.

            Reaching further back than your plan's archive horizon returns 403
            (see the `403` response) — the window is subject to the same tiered
            depth as a deep `cursor`, and on the first page just the same.
            Cannot be combined with `sort=ingested` (400): delta mode returns
            rows in ingest order from your cursor and never walks back into
            history.
          schema: { type: string, format: date-time }
          example: "2026-06-01T00:00:00Z"
        - in: query
          name: to_date
          description: >-
            Inclusive upper bound on `time_published`, same format as
            `from_date`. A bare date (`2026-06-01`) covers the WHOLE day
            (through `23:59:59.999999Z`), so `from_date=2026-06-01&to_date=2026-06-01`
            returns that day rather than an empty page. `from_date` later than
            `to_date` returns 400.
          schema: { type: string, format: date-time }
          example: "2026-06-30T23:59:59Z"
        - in: query
          name: source_type
          description: >-
            Keep only rows ingested from these sources: `gdelt` (press
            coverage), `sec_form4` (insider transactions), `sec_form8k`
            (8-K current reports), `sec_form6k` (a foreign private issuer's
            6-K earnings release). Same single / CSV / repeated forms as
            `category`, OR-matched. Unknown values return 400. Composes with
            every other filter: `source_type=sec_form8k&symbol=NVDA` is one
            company's 8-Ks, `source_type=gdelt&min_relevance=8` is the press
            without any filing.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/NewsSourceType" }
        - in: query
          name: item
          description: >-
            8-K item code, e.g. `5.02` (officer departures/appointments),
            `8.01` (other events), `1.01` (material agreements). Keeps only
            8-K filings that carry the item — ANY item of the filing, not just
            the one that drove its category — and implies
            `source_type=sec_form8k`; `item` next to any other `source_type`
            returns 400 (only 8-Ks have item codes). The category filter
            already covers the two headline items (`2.02` → `earnings`, `2.01`
            → `mergers_acquisitions`); `item` is for everything else. A filing
            SEC served no document for has an empty item list and never
            matches. Every matched row carries the `filing` block.
          schema: { type: string, pattern: "^\\d\\.\\d{2}$", example: "5.02" }
        - in: query
          name: event_type
          description: >-
            Corporate event type, e.g. `buyback`, `m_and_a`, `exec_change`
            (the full list is `CorporateEventType`). Keeps only rows whose
            `event` block is of that type, as the main event or as one of the
            events in `event.also`, so `event_type=buyback` also finds a
            buyback announced inside an earnings release. Same single / CSV /
            repeated forms as `category`, OR-matched:
            `event_type=buyback,dividend` is every capital return. Events are
            read from SEC 8-K filings, 6-K earnings releases and PR Newswire
            releases, so only those rows can match; press coverage of the same
            event carries no `event`. Composes with the other filters
            (`event_type=m_and_a&symbol=NVDA`, `event_type=offering&from_date=…`)
            in the default `sort=published` order. With `sort=ingested` it
            returns 400: a row gets its event after it enters the feed, so a
            delta cursor would already be past it. To follow new events, poll
            `sort=published` with `from_date` and de-duplicate by `uid`. With
            `collapse=story` only the row that leads its story is matched, so
            a filing that joined a story a publisher started is left out; omit
            `collapse` for the complete list. An unknown type returns 400 with
            the allowed values; so does `event_type` next to a `source_type`
            that names only `sec_form4`.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/CorporateEventType" }
          example: ["buyback", "dividend"]
      responses:
        "200":
          description: A page of enriched articles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsPagination" }
        "400":
          description: >-
            Invalid cursor (opaque; reuse `next_cursor`), a cursor replayed
            into the other `sort` mode, a date window combined with
            `sort=ingested` or with `from_date` after `to_date`, unsupported
            `collapse`/`sort` value, a `page_size` outside 1-50 or not
            permitted on this tier, an unknown `source_type`, a malformed
            `item`, `item` combined with a `source_type` other than
            `sec_form8k`, an unknown `event_type` (the body lists the allowed
            values), `event_type` combined with a `source_type` whose rows
            carry no events, or `event_type` combined with `sort=ingested`.
        "403": { $ref: "#/components/responses/ArchiveGated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409": { $ref: "#/components/responses/DeltaScanIncomplete" }
        "503": { $ref: "#/components/responses/DeltaCandidatesChanged" }

  /api/news/search/:
    get:
      tags: [news]
      summary: Full-text search over the feed
      description: |
        Search the enriched feed by words. `q` is matched against each
        article's title, its summary and the entity names the enrichment
        extracted; the page comes back ranked (best match first, newest first
        among equal matches), with a per-item `search_match` and a `query`
        block that says how the words were read. `symbol`, `category`,
        `source_type`, `item`, `min_relevance`, `from_date`, `to_date` and
        `collapse` apply as hard filters on top, exactly as on `/api/news/`:
        `q=director&item=5.02` searches 8-K filings that carry item 5.02,
        `q="going concern"&source_type=gdelt` searches press coverage only.

        **Query syntax.** Bare words are all required (`chip tariffs`); a
        quoted phrase must appear in order (`"going concern"`); `-word`
        excludes (`apple -iphone`); `OR` separates alternatives
        (`nvidia OR amd`). Words in a non-Latin script are ignored. Matching
        tolerates one typo from five letters (`prices` reaches `price`) and a
        prefix on the last word; there is no stemming.

        **Modes** (`query.mode`). `strict`: every word matched. `broadened`:
        the strict pass found fewer than 5 rows and the query has three or
        more words, so the most frequent words were dropped and the page
        carries rows with at least two of the query's words —
        `search_match.terms_matched` says how many on each; read these as
        leads, not matches. `no_match`: nothing in the searched window.
        `no_terms`: the query held no searchable words. Absence is not proof
        the event did not happen: the searched window starts at
        `query.window_from`.

        **Window and paging.** The searched window is your plan's archive
        horizon (Free 30 days, Basic 90, Pro 180) unless `from_date` /
        `to_date` narrow it; a window reaching past the horizon returns 403
        like the feed. Results are bounded to the best 200 matches (`matched`
        counts them, capped at 200) and paged with an opaque `cursor` that is
        bound to the query that issued it. Responses are private and never
        shared-cached.

        **Failure.** When the search service does not answer in time the
        endpoint returns 503 with `extra.reason = "search_unavailable"`. The
        structured feed and every other endpoint are unaffected: retry the
        search later rather than the whole chain.
      parameters:
        - in: query
          name: q
          required: true
          description: >-
            The words to search for, 2 to 200 characters (syntax above).
            `query` is accepted as an alias.
          schema: { type: string, minLength: 2, maxLength: 200, example: "Jane Street" }
        - in: query
          name: cursor
          description: Opaque cursor from a prior response's `next_cursor`; only valid with the `q` that issued it.
          schema: { type: string }
        - in: query
          name: symbol
          description: Hard ticker filter, same forms and expansions as on `/api/news/` (`ticker` is an alias).
          schema: { type: string, example: "NVDA" }
        - in: query
          name: category
          description: Hard category filter — single value, CSV or repeated, OR-matched.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/NewsCategory" }
        - in: query
          name: source_type
          description: >-
            Keep only rows ingested from these sources, same values and
            forms as on `/api/news/`: `gdelt` (press coverage), `sec_form4`,
            `sec_form8k`, `sec_form6k`. Single, CSV or repeated, OR-matched.
            Unknown values return 400.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [gdelt, sec_form4, sec_form8k, sec_form6k] }
        - in: query
          name: item
          description: >-
            8-K item code, e.g. `5.02`: only 8-K filings carrying that item
            (any item of the filing). Implies `source_type=sec_form8k`; next
            to any other `source_type` it returns 400.
          schema: { type: string, pattern: "^\\d\\.\\d{2}$", example: "5.02" }
        - in: query
          name: min_relevance
          description: >-
            Relevance floor, `1`-`10`. The default `4` leaves out low-relevance
            articles; `1`-`3` includes them, `7` and up keeps the strongest.
          schema: { type: integer, minimum: 1, maximum: 10, default: 4 }
        - in: query
          name: page_size
          description: Items per page, default `10`; `1`-`20` on every tier, up to `50` on a Pro key (`limit` is an alias).
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: collapse
          description: "`story` collapses coverage of one event to its best-ranked article, with `story_id`, `sources_count` and `sources` on each item."
          schema: { type: string, enum: [story] }
        - in: query
          name: collapse_stories
          description: >-
            Boolean alias: `true` is equivalent to `collapse=story`; `false`
            leaves articles ungrouped. Send either spelling, not both (400).
          schema: { type: boolean, default: false }
        - in: query
          name: from_date
          description: Inclusive lower bound on `time_published` (ISO-8601, UTC when naive; a bare date is that day's midnight). Past your archive horizon → 403.
          schema: { type: string, format: date-time }
        - in: query
          name: to_date
          description: Inclusive upper bound on `time_published`; a bare date covers its whole day.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of ranked matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsSearchPage" }
        "400": { description: "`q` missing or outside 2-200 characters, an invalid cursor or one issued for another query, a `page_size` outside 1-50 or not permitted on this tier, `from_date` after `to_date`, an unknown `source_type`, a malformed `item` or one combined with a non-8-K `source_type`, or an unsupported `collapse` value." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ArchiveGated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The search service did not answer in time. The body carries `extra.reason = "search_unavailable"`; the feed endpoints are unaffected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Search is temporarily unavailable; the structured feed at /api/news/ is not affected." }
                  extra:
                    type: object
                    properties:
                      reason: { type: string, enum: [search_unavailable] }

  /api/news/trending/:
    get:
      tags: [news]
      summary: Trending news (last 48h)
      description: >-
        Top stories from the trailing 48h: `relevance_score >= 8`, ranked by
        relevance score decayed by article age, so a fresh story outranks an
        equally-scored stale one. At most two stories per ticker. Fixed size
        of 10, no pagination. Coverage of one story, syndicated reprints and
        independent write-ups of the same event alike, is collapsed to a
        single representative, and each item carries the `story_id`,
        `sources_count` and `sources` fields for the story it represents.
        `story_id` is the story ROOT's uid — the stable story key shared with
        `?collapse=story` and the MCP tools — while the item itself is the
        story's strongest-ranked member, so `story_id` may differ from the
        item's own `original.uid`. Most stories are carried by a single
        outlet, so `sources_count` is usually 1; see its field description.
      responses:
        "200":
          description: List of enriched articles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RichNewsArticle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/news/insider/:
    get:
      tags: [news]
      summary: Insider-transaction news (SEC Form 4)
      description: |
        Dedicated insider feed (`category=insider`): SEC EDGAR Form 4 insider
        activity ONLY — one deterministic-templated row per filing event
        (a filing's non-derivative trades of one type and holding form,
        aggregated: total shares, volume-weighted average price and executed
        range, total value), surfaced shortly after filing, with the relevance
        score computed from the event's total (size, buy vs. sell, 10b5-1 plan
        or not). A sale (`transaction_code` `S`) tops out at 6 whatever its
        size, and so does a sale back to the issuer (`D`) that leaves the
        insider with no shares, which is how holdings are cashed out when an
        acquisition closes. Purchases, and a `D` that leaves a holding (the
        company buying back a holder's block), use the full scale. A sale
        filed without a price stays at 6 too. Same enriched shape, ticker
        and `relevance_score >= 4` filtering, and cursor-based pagination as
        `/api/news/`. Equivalent to `/api/news/?category=insider`, surfaced as a
        first-class route. For aggregate stats instead of the stream, see
        `/api/symbols/{ticker}/insider-summary/`.

        The category is fixed to `insider`. This endpoint does not accept
        `category`, `exclude_categories` or story-grouping parameters; use
        `/api/news/` for those filters.

        To watch for new filings, poll with `sort=ingested` rather than
        re-reading the newest page: a Form 4 is filed up to several days after
        the trade it reports, so a new event often enters the feed already
        below the head of the publish-ordered page. Delta mode orders by the
        moment the row became available, so it never misses one. The contract
        is identical to `/api/news/?sort=ingested` — see that endpoint for the
        full description.
      parameters:
        - in: query
          name: cursor
          description: Opaque cursor from a prior response's `next_cursor`. Omit for the newest page.
          schema: { type: string }
        - in: query
          name: symbol
          description: >-
            Filter to insider news that mentions this ticker. Delisted
            symbols return their history; a renamed company's current ticker
            also matches rows tagged with its former ticker. `ticker` is
            accepted as an alias.
          schema: { type: string, example: "NVDA" }
        - in: query
          name: min_relevance
          description: >-
            Override the default ≥4 threshold. Insider rows score
            deterministically from the event's summed dollar value (plus
            buy/10b5-1 modifiers), and a sale tops out at 6, so this acts as
            an "only large trades" dial: `min_relevance=6` keeps purchases
            from roughly $500k and sales from roughly $1M, `min_relevance=7`
            keeps purchases from roughly $1M and no sales, except a large
            buyback by the company from a holder who keeps a stake
            (`transaction_code` `D`). A 10b5-1 plan trade sits one step lower.
          schema: { type: integer, minimum: 1, maximum: 10, default: 4 }
        - in: query
          name: is_10b5_1
          description: >-
            Filter on the same field each item's `insider` block reports: the
            event's Rule 10b5-1 status. Omit for every event; `false` returns
            events not under a 10b5-1 plan; `true` returns plan events only.
            Event-level, like the field itself: a filing whose group mixes plan
            and non-plan tranches counts as a plan event on both. The two values
            partition the feed, so `true` and `false` pages always add up to the
            unfiltered one.

            "Not under a plan" is not the same as "the insider's own decision".
            A sale outside a plan can still be paperwork: shares sold to pay the
            tax on vesting, or a sale that only covers the cost of an option
            exercise. For sales the insider chose to make, use
            `decision=discretionary`.
          schema: { type: boolean }
        - in: query
          name: decision
          description: >-
            Filter on the sale label each item's `insider` block reports
            (`decision`). `discretionary` returns sales the insider chose to
            make; `plan_like` returns sales that follow from a 10b5-1 plan or
            from paperwork (a tax sale on vesting, a sale covering an option
            exercise); `unknown` returns sales the filing does not let us read.
            Only sales (`transaction_code` `S`) are labelled. Purchases and
            other codes carry `decision: null` and match none of the values, so
            the three filtered feeds plus the events without a sale add up to
            the unfiltered one. Combines with `is_10b5_1`, `sort=ingested` and
            every other filter.
          schema: { type: string, enum: [discretionary, plan_like, unknown] }
        - in: query
          name: page_size
          description: >-
            Items per page, default `10`. Any value from `1` to `20` is accepted
            on every tier; `21`-`50` requires a Pro key. A value outside `1`-`50`,
            or an over-`20` page without a Pro key, returns 400. `limit` is
            accepted as an alias.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: sort
          description: >-
            `published` (default) is the reverse-chronological feed.
            `ingested` is delta-polling mode, with the same contract as on
            `/api/news/`: rows in the order they became available, ascending,
            `next_cursor` always returned (empty `results` = caught up), and
            all other filters applied unchanged. Prefer it for watching insider
            activity — a Form 4 is filed days after the trade it reports, so a
            new event routinely lands below the newest page of the
            publish-ordered feed and a poller reading only the head misses it.
            Cursors are mode-specific: a cursor is only valid with the sort mode
            that issued it (a mismatch returns 400).
          schema: { type: string, enum: [published, ingested], default: published }
        - in: query
          name: from_date
          description: >-
            Inclusive lower bound on `time_published`, identical in format and
            behaviour to the parameter on `/api/news/` (ISO-8601, naive read as
            UTC, tier-gated with 403, refused with `sort=ingested`).

            Note which clock it is: `time_published` is when the filing reached
            the feed, NOT the insider's `transaction_date` reported in the
            `insider` block. A Form 4 is filed days after the trade, so a window
            over trade dates is a different question and this parameter does not
            answer it.
          schema: { type: string, format: date-time }
          example: "2026-06-01T00:00:00Z"
        - in: query
          name: to_date
          description: >-
            Inclusive upper bound on `time_published`. A bare date covers the
            whole day; same clock caveat as `from_date`.
          schema: { type: string, format: date-time }
          example: "2026-06-30T23:59:59Z"
        - in: query
          name: format
          description: |
            Response format. `json` (default) is the page described below.
            `csv` streams the same feed as a file: one row per insider event,
            the same filters (`symbol`, `min_relevance`, `is_10b5_1`,
            `decision`, `from_date`/`to_date`, `sort`, `cursor`), walked page by page on
            the server up to your plan's **row cap** — Free 500, Basic 2 000,
            Pro 10 000 rows per file — inside your plan's archive horizon
            (30 / 90 / 180 days). `page_size` has no effect on CSV. One
            request counts once against your rate limit, whatever the file's
            length.

            Where a JSON page past the horizon returns 403, the file stops at the horizon and the
            response headers say so (`X-Alphai-Truncated: archive_horizon`).
            Validation errors (a bad cursor, an inverted window, a window with
            `sort=ingested`) are the same 400 JSON bodies as for `format=json`,
            sent before any row.

            Concurrent feed changes or a connection error can interrupt the
            stream after headers are sent. Accept a file only after the stream
            completes and the number of parsed CSV data rows matches
            `X-Alphai-Rows`. Otherwise discard the partial file and retry the
            original request; do not advance to `X-Alphai-Next-Cursor`.

            Response: `Content-Type: text/csv; charset=utf-8`,
            `Content-Disposition: attachment; filename="alphai-insider-<date>.csv"`,
            `Cache-Control: private, no-store`, plus the `X-Alphai-*` headers
            listed under the 200 response: `X-Alphai-Rows` (data rows in the
            file), `X-Alphai-Row-Cap` (your plan's cap), `X-Alphai-Truncated`
            (`row_cap` — more rows exist, continue with the cursor;
            `archive_horizon` — the walk reached your plan's archive depth;
            `false` — the file holds everything the filters select) and
            `X-Alphai-Next-Cursor` (present when there is more: the same token
            a JSON page would have returned at that position, so you can
            continue in either format).

            Columns, in order: `uid`, `time_published`, `tickers`
            (`|`-joined), `title`, `url`, `category`, `relevance_score`,
            `side`, `transaction_code`, `shares`, `avg_price_usd`,
            `total_value_usd`, `is_10b5_1`, `insider_name`, `insider_title`,
            `is_officer`, `is_director`, `is_ten_percent_owner`,
            `transaction_date`, `filed_at`, `late_filing`, `summary`,
            `decision`, `decision_reason` — the JSON item's fields and its
            `insider` block flattened (event columns are empty for a row
            without a block). New columns are only ever appended after the
            last one. RFC 4180 quoting,
            LF line endings, UTF-8, timestamps in ISO 8601 UTC (`Z`),
            booleans `true`/`false`, an empty cell for null, never the article
            body. A free-text cell that begins with `=`, `+`, `-`, `@` or a
            tab is prefixed with an apostrophe so it cannot run as a formula
            when the file is opened in a spreadsheet.

            Select the format with this parameter only: an `Accept: text/csv`
            header on its own still returns JSON, and a client that sends
            `Accept: application/json` together with `format=csv` gets 406.
            With `sort=ingested` and no cursor the file holds the newest rows
            (up to the cap) in ingest order and the cursor parks at the head,
            like the JSON prime page; with a cursor it holds everything since
            that position, with rows older than your archive horizon skipped
            and reported as `archive_horizon`.
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        "200":
          description: >-
            A page of enriched insider-transaction articles. Each item
            additionally carries the structured `insider` event block
            (side / shares / average price / total value / reporting owner) —
            populated on this endpoint only. With `format=csv`, the same rows
            as a streamed CSV file: see the `format` parameter for the
            columns, the per-plan row caps and the `X-Alphai-*` headers.
          headers:
            X-Alphai-Rows:
              description: "`format=csv` only. Data rows in the file (the header line is not counted)."
              schema: { type: integer }
            X-Alphai-Row-Cap:
              description: "`format=csv` only. Your plan's rows-per-file cap (Free 500, Basic 2 000, Pro 10 000)."
              schema: { type: integer }
            X-Alphai-Truncated:
              description: >-
                `format=csv` only. Why the file ended: `row_cap` (more rows
                exist; continue with `X-Alphai-Next-Cursor`), `archive_horizon`
                (the walk reached your plan's archive depth), or `false` (the
                file holds everything the filters select).
              schema: { type: string, enum: [row_cap, archive_horizon, "false"] }
            X-Alphai-Next-Cursor:
              description: >-
                `format=csv` only, present when there is more. The same
                `next_cursor` a JSON page would have returned at this
                position — pass it as `cursor` to continue in either format.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsPagination" }
            text/csv:
              schema: { type: string }
              example: |
                uid,time_published,tickers,title,url,category,relevance_score,side,transaction_code,shares,avg_price_usd,total_value_usd,is_10b5_1,insider_name,insider_title,is_officer,is_director,is_ten_percent_owner,transaction_date,filed_at,late_filing,summary,decision,decision_reason
                3f9a1c2b7d8e4f60,2026-09-19T21:12:04Z,NVDA,"NVIDIA insider HUANG JEN HSUN sold 75,000 shares for $13.1M under a 10b5-1 plan",https://www.sec.gov/Archives/edgar/data/1045810/000104581026000123/xslF345X05/wk-form4.xml,insider,6,sell,S,75000,174.66,13099500,true,HUANG JEN HSUN,President and CEO,true,true,false,2026-09-18,2026-09-19T21:12:04Z,false,"Jen Hsun Huang, President and CEO of NVIDIA, sold 75,000 shares on 2026-09-18 at an average price of $174.66, for $13.1M, under a Rule 10b5-1 trading plan.",plan_like,plan_10b5_1
        "400": { description: Invalid cursor (opaque; reuse `next_cursor`), a cursor replayed into the other `sort` mode, a date window combined with `sort=ingested` or with `from_date` after `to_date`, an unsupported `sort` or `decision` value, or a `page_size` outside 1-50 or not permitted on this tier. }
        "403": { $ref: "#/components/responses/ArchiveGated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409": { $ref: "#/components/responses/DeltaScanIncomplete" }
        "503": { $ref: "#/components/responses/DeltaCandidatesChanged" }

  /api/news/insider/clusters/:
    get:
      tags: [news]
      summary: Insider cluster buys (several insiders of one issuer buying together)
      description: |
        Episodes in which **several different insiders of one issuer bought on
        the open market together**: an issuer's Form 4 purchase dates are
        chained into one episode while consecutive purchases are at most 10
        days apart (an episode is cut at 30 days), and every purchase inside
        it is examined before a buyer counts.

        Counting names is not enough — the loudest look-alikes are an IPO or
        PIPE allocation (caught by its price shape, or by the filing's own
        footnote saying the shares came from the issuer, an offering or a
        negotiated block), a mutual-bank conversion, ESPP / DRIP /
        director-plan lots, the same transaction reported through two owners
        (a director via the fund and the fund itself), and plan lots sitting
        next to one real purchase. Each buyer therefore carries a `role`:
        `independent` buyers are the cluster; `plan_like` (with `reason` when
        the filing's words decided it), `unpriced` and `duplicate_of` buyers
        are listed so you can see why a 30-name filing burst is not one. The episode's `pattern` is `open_market` when at
        least two independent buyers remain and one of them is an officer or
        director, `holders_only` when only 10% holders without a role remain,
        and `plan_or_offering` otherwise. The default hides everything but
        `open_market`; ask for the rest explicitly. The rule was fixed against
        90 episodes checked by hand against the filings (2026-09-22): it shows
        58 of 58 real clusters and hides 29 of 30 look-alikes; a 401(k) plan
        purchase can still pass, since the filing says so only in a footnote.

        `days` is measured on `known_at` — the moment the episode's latest
        filing reached EDGAR — so "what became known this month" is one call.
        A purchase filed more than ~40 days after the trade is not chained
        (2.3% of Form 4 purchases). Coverage starts at `meta.coverage_since`
        (the tranche table begins in August 2025); this is a descriptive
        screen (`research_only`, not point-in-time), with no returns attached.
        Only common-stock purchases outside Rule 10b5-1 plans are considered;
        units, preferred and warrants are ignored.
      parameters:
        - in: query
          name: days
          description: >-
            Lookback in days over `known_at`, `1`-`90`, default `30`. Deeper
            than your plan's archive horizon (Free 30, Basic 90) returns 403.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
        - in: query
          name: min_buyers
          description: >-
            Minimum headcount, `2`-`10`, default `2`: independent buyers for
            `open_market` / `holders_only` episodes, everyone who bought
            (`buyers_total`) for `plan_or_offering` ones, where by construction
            fewer than two buyers are independent.
          schema: { type: integer, minimum: 2, maximum: 10, default: 2 }
        - in: query
          name: min_usd
          description: >-
            Drop episodes whose `total_usd` is below this. An episode with an
            unknown total (`value_partial` with no priced fill) is kept, not
            dropped — a missing number is not a small one.
          schema: { type: integer, minimum: 0 }
        - in: query
          name: pattern
          description: >-
            `open_market` (default), `plan_or_offering`, `holders_only`, or
            `all`. Insiders taking a $70M IPO allocation is an event too; it
            is labeled, not hidden, when you ask for it.
          schema: { type: string, enum: [open_market, plan_or_offering, holders_only, all], default: open_market }
        - in: query
          name: symbol
          description: >-
            One ticker. A renamed company's current ticker also matches
            episodes tagged with its former ticker, and share-class siblings
            (GOOGL / GOOG) match each other. A delisted ticker still returns
            its episodes when named explicitly; the unfiltered list shows
            active listings only. `ticker` is accepted as an alias.
          schema: { type: string, example: "NVDA" }
        - in: query
          name: sort
          description: >-
            `recent` (default) — newest `known_at` first; `buyers` — most
            independent buyers first, ties by value; `value` — largest
            `total_usd` first, unknown totals last. Cursors are sort-specific.
          schema: { type: string, enum: [recent, buyers, value], default: recent }
        - in: query
          name: cursor
          description: Opaque cursor from a prior response's `next_cursor`, with the same `sort`. Omit for the first page.
          schema: { type: string }
        - in: query
          name: page_size
          description: >-
            Items per page, default `10`; `1`-`20` on every tier, `21`-`50`
            with a Pro key. `limit` is accepted as an alias.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: A page of classified purchase episodes, newest known first by default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsiderClustersPage" }
        "400": { description: A parameter outside its range or enum, an unknown parameter, a cursor issued under another `sort`, or a `page_size` above 20 without a Pro key. }
        "403": { $ref: "#/components/responses/ArchiveGated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/news/macro/:
    get:
      tags: [news]
      summary: Market-wide macro news (central banks, prints, commodities, geopolitics)
      description: |
        Dedicated macro feed: the `macro_economy`, `commodities` and
        `geopolitics` categories in one stream — central-bank decisions and
        statements (FOMC), inflation/jobs prints, oil and gold, geopolitical
        risk. Same enriched shape, `relevance_score >= 4` floor and
        cursor-based pagination as `/api/news/`; equivalent to
        `/api/news/?category=macro_economy,commodities,geopolitics`, surfaced
        as a first-class route.

        Macro rows are market-wide, so most carry an empty `tickers` list —
        that is by design (an FOMC statement is not news about one company),
        and the per-article analysis block is still populated. A macro row
        that IS about listed companies (an oil-price story tagged to majors)
        keeps its tickers.

        To watch for new releases, poll with `sort=ingested` — same delta
        contract as `/api/news/?sort=ingested`.
      parameters:
        - in: query
          name: cursor
          description: Opaque cursor from a prior response's `next_cursor`. Omit for the newest page.
          schema: { type: string }
        - in: query
          name: category
          description: >-
            Narrow to a subset of the macro categories, comma-separated.
            Values outside `macro_economy`/`commodities`/`geopolitics` return
            400 (the full category filter lives on `/api/news/`).
          schema: { type: string, example: "macro_economy" }
        - in: query
          name: min_relevance
          description: >-
            Override the default ≥4 threshold. On release days the release
            itself scores 7-9, so `min_relevance=7` keeps roughly
            "the events" and drops the commentary.
          schema: { type: integer, minimum: 1, maximum: 10, default: 4 }
        - in: query
          name: page_size
          description: >-
            Items per page, default `10`. Any value from `1` to `20` is accepted
            on every tier; `21`-`50` requires a Pro key. A value outside `1`-`50`,
            or an over-`20` page without a Pro key, returns 400. `limit` is
            accepted as an alias.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: sort
          description: >-
            `published` (default) is the reverse-chronological feed.
            `ingested` is delta-polling mode, with the same contract as on
            `/api/news/`. Cursors are mode-specific: a cursor is only valid
            with the sort mode that issued it (a mismatch returns 400).
          schema: { type: string, enum: [published, ingested], default: published }
        - in: query
          name: from_date
          description: >-
            Inclusive lower bound on `time_published`, exactly as on
            `/api/news/`: ISO-8601, a value without a timezone is read as UTC,
            a bare date (`2026-09-16`) means that day's midnight. "What did the
            tape say after the decision" is `from_date=<decision day>` plus
            `min_relevance=7`. Subject to your plan's archive horizon (403 on
            the first page, see the `403` response) and refused with
            `sort=ingested` (400).
          schema: { type: string, format: date-time }
          example: "2026-09-16T00:00:00Z"
        - in: query
          name: to_date
          description: >-
            Inclusive upper bound on `time_published`, same format as
            `from_date`. A bare date covers the WHOLE day, so
            `from_date=2026-09-16&to_date=2026-09-16` returns that day.
            `from_date` later than `to_date` returns 400.
          schema: { type: string, format: date-time }
          example: "2026-09-17T23:59:59Z"
      responses:
        "200":
          description: A page of enriched macro articles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsPagination" }
        "400": { description: Invalid cursor (opaque; reuse `next_cursor`), a cursor replayed into the other `sort` mode, a category outside the macro set, a `page_size` outside 1-50 or not permitted on this tier, a date window combined with `sort=ingested`, or `from_date` after `to_date`. }
        "403": { $ref: "#/components/responses/ArchiveGated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409": { $ref: "#/components/responses/DeltaScanIncomplete" }
        "503": { $ref: "#/components/responses/DeltaCandidatesChanged" }

  /api/calendar/:
    get:
      tags: [calendar]
      summary: Scheduled US macro releases (economic calendar)
      description: |
        The official forward schedule of US macro releases: FOMC decisions
        (with SEP and press-conference markers) and minutes, CPI, PPI, the
        jobs report (nonfarm payrolls), GDP estimates (advance/second/third),
        PCE, advance retail sales, weekly jobless claims and JOLTS — sourced
        from the agencies' own schedule pages (Fed, BLS, BEA, Census, DOL).

        Each occurrence carries a stable `uid` (`US-CPI-2026-07`) that
        survives reschedules: a moved release keeps its identity, updates
        `scheduled_at` and reports `schedule_status`. `phase` says only
        whether the scheduled moment has passed (`upcoming`/`elapsed`) — it
        deliberately does not claim the agency actually published. Pair the
        calendar with `/api/news/macro/` to read what a release meant once
        it's out.

        The window is `[from_date, to_date)` — from inclusive, to exclusive;
        date-only values mean UTC midnight; defaults are today (UTC) → +7
        days; the span is capped at 400 days. No pagination: a full year of
        every series is ~250 rows (hard cap 500), ordered by `scheduled_at`
        ascending. Cancelled and postponed occurrences stay in the response
        with their `schedule_status`.
      parameters:
        - in: query
          name: from_date
          description: >-
            Window start, inclusive. `YYYY-MM-DD` (UTC midnight) or an ISO
            datetime (naive = UTC). Default: today, UTC midnight.
          schema: { type: string, example: "2026-08-07" }
        - in: query
          name: to_date
          description: >-
            Window end, exclusive. Same formats. Default `from_date` + 7 days;
            span capped at 400 days.
          schema: { type: string, example: "2026-08-14" }
        - in: query
          name: event_key
          description: Narrow to specific series, comma-separated. Unknown keys return 400.
          schema: { type: string, example: "cpi,nfp,fomc_decision" }
        - in: query
          name: importance
          description: Narrow by importance tier.
          schema: { type: string, enum: [high, medium, low] }
        - in: query
          name: country
          description: v1 covers US releases only.
          schema: { type: string, enum: [US], default: US }
      responses:
        "200":
          description: Occurrences within the window, `scheduled_at` ascending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvents" }
        "400":
          description: >-
            Unknown parameter or value, a malformed date, `to_date` not after
            `from_date`, or a window over 400 days.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/calendar/earnings/:
    get:
      tags: [calendar]
      summary: Who reports when and who just reported (earnings calendar)
      description: |
        Companies with an upcoming report date, by day. Only dates the source
        marks as confirmed are listed; estimates are left out, so later days
        fill in as companies announce, and a company missing here may still
        report. Covers large and actively followed companies, not every listing.

        Today and the 7 days before it also list the companies whose report we
        read, on the day the filing landed, with `status` `reported`. Set
        `from_date` to reach them; the default window starts today. A company
        can appear on a past day and on a later date when the source still
        holds that date.

        One row per company on a day, share classes included. Rows are ordered by
        day, then by how much recent news the company drew. There is no pagination:
        the window and the calendar's own size bound the response.

        `report_date` is a New York market day. `session` is the expected
        session when the source states one, never an exact time. `status` turns
        to `reported` once the company's SEC filing lands, which can be up to
        two days before `report_date`; `reported_at` is then that filing's
        acceptance time. A company outside SEC filings (a foreign local listing)
        stays `scheduled`.

        `detail=full` adds `previous_read`: the company's own guidance and what
        to watch, from our AI read of its previous report. It is not an analyst
        estimate. It also adds `report_read`, the uid, listing, period and verdict
        of our read of the report the row is about. Use
        `/api/symbols/{ticker}/earnings/` for the reads themselves and
        `/api/calendar/` for macro releases.
      parameters:
        - in: query
          name: from_date
          description: >-
            First market day, inclusive, `YYYY-MM-DD`. Default: today in New
            York. Days more than 7 days before today hold no rows.
          schema: { type: string, format: date, example: "2026-11-09" }
        - in: query
          name: to_date
          description: >-
            Last market day, exclusive. Default `from_date` + 7 days; span
            capped at 45 days.
          schema: { type: string, format: date, example: "2026-11-16" }
        - in: query
          name: ticker
          description: >-
            Only these companies, comma-separated, up to 50. Another share class
            of a company matches and answers under the symbol you asked for.
          schema: { type: string, example: "NVDA,GOOGL" }
        - in: query
          name: sector
          description: Only this sector, case-insensitive, as `/api/symbols/` spells it.
          schema: { type: string, example: "Healthcare" }
        - in: query
          name: detail
          description: "`full` adds `previous_read` and `report_read` to each row."
          schema: { type: string, enum: [compact, full], default: compact }
      responses:
        "200":
          description: Companies reporting, or having reported, in the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarningsCalendar" }
        "400":
          description: >-
            Unknown parameter or value, a malformed date, `to_date` not after
            `from_date`, a window over 45 days, or more than 50 tickers.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/news/brief/:
    get:
      tags: [news]
      summary: A compact brief across multiple tickers
      description: |
        One response with recent news grouped by story, a separate SEC Form
        4/8-K/6-K filings section, and the next confirmed earnings date per
        ticker. Supply your symbols explicitly; this endpoint does not read
        an account's saved watchlist. The website and MCP tool
        `alphai_watchlist_brief` use the caller's saved list instead.

        `hours` is a publication-time window ending at `generated_at`, both
        ends inclusive. This is a ranked snapshot, not a delta since the last
        call. Bulk backfills are excluded. Within each section, the newest
        500 matching articles at the configured relevance floor (default 4)
        are grouped, then ranked by each group's highest relevance and novelty,
        then its newest publication time. Fields on a returned event describe
        the representative article. `limit`
        applies independently to news and filings. Either a candidate overflow
        or additional grouped stories sets that section's `*_truncated` flag.
        A truncated response is a selection, not a complete event inventory;
        narrow `hours` or use the paginated ticker feed for further coverage.

        An event shared by several requested tickers appears once, with
        `matched_tickers` naming all matches. If press coverage and a filing
        share a story, the filing represents it once in the filings section.
        Distinct Form 4 transaction legs
        remain separate even when they share a filing URL. Share classes and
        former ticker names are included. Unrecognized symbols are returned
        in `unknown_tickers`; bare crypto names are not guessed (use BTC-USD).
        Dates are confirmed only, on or after today's America/New_York date,
        excluding reports already matched to a published filing;
        absence means no confirmed date on file, not that no report is due.
        Available on every tier. Responses use `Cache-Control: private, no-store`.
      parameters:
        - in: query
          name: tickers
          required: true
          description: 1–100 distinct symbols, comma-separated or repeated; case-insensitive.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, maxLength: 20 }
          example: [NVDA, AMD, BTC-USD]
        - in: query
          name: hours
          schema: { type: integer, minimum: 1, maximum: 168, default: 24 }
        - in: query
          name: limit
          description: Maximum grouped stories in each section; this brief has no cursor.
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        "200":
          description: Brief with explicit coverage and truncation information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistBriefDTO" }
        "400": { description: Invalid, missing or unknown query parameter. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/news/{uid}/:
    get:
      tags: [news]
      summary: Get a news article by UID
      description: |
        One enriched article. SEC rows carry the same structured block the
        feeds serve: `insider` on a Form 4 row (as on `/api/news/insider/`),
        `filing` on an 8-K row (as on `/api/news/`), so a uid taken from
        `/api/news/insider/clusters/` opens with its trade data. An 8-K or
        6-K earnings filing can also carry `earnings` (see that field), which
        no feed populates.
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{16}$" }
      responses:
        "200":
          description: A single enriched article.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RichNewsArticle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/news/{uid}/related/:
    get:
      tags: [news]
      summary: Articles related to one article
      description: |
        Up to 6 articles related to the given article: fresh articles sharing
        a ticker first, then same-category recents as backfill. Same enriched
        shape and `relevance_score >= 4` filtering as `/api/news/`; insider
        (SEC Form 4) rows are excluded unless the base article is itself
        insider. No pagination — the list is a fixed-size block.
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{16}$" }
      responses:
        "200":
          description: Related enriched articles (possibly fewer than 6).
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    maxItems: 6
                    items: { $ref: "#/components/schemas/RichNewsArticle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/stories/top/:
    get:
      tags: [stories]
      summary: Top stories (last 48h)
      description: |
        The strongest stories of the trailing 48 hours, ranked: a story's
        `importance` plus a coverage bonus of `min(3, log2(publishers))`,
        minus one point per 12 hours since its key facts last changed
        (`updated_at`). One slot per ticker and two per no-ticker macro
        category, so one event cannot fill the list. Only stories with a
        published summary and `importance >= 7` qualify. Fixed size of up to
        50, no pagination; `ranking_version` names the formula so a change
        is visible, `as_of` is when the list was ranked.

        Compared with `/api/news/trending/`: trending ranks single articles
        and collapses reprints; this ranks the stories themselves (two or
        more publishers), each with an AlphAI-written summary. A story's
        `story_id` is the same key an article row carries, so a trending
        item's `story_id` opens the story here.
      responses:
        "200":
          description: Ranked stories, strongest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopStories" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The Stories section is switched off. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/stories/:
    get:
      tags: [stories]
      summary: Latest stories (cursor-paginated)
      description: |
        Stories newest-first by the time of their latest article
        (`last_material_at`): stories with a published summary and
        `importance >= 7`. Keyset pagination: omit `cursor` for the newest
        page, pass `next_cursor` back for the next (older) one; `null` means
        the end. Cursors are opaque; an invalid one is a 400. Archive depth
        is tiered as on the feeds — paging back past your plan's horizon
        (Free 30 days, Basic 90, Pro 180) returns 403 `archive_horizon`.

        A story keeps moving up this list while articles keep joining it
        (`last_material_at` is the keyset), and its summary is rewritten as
        materials arrive, so re-reading a `story_id` later can return a
        different summary — `updated_at` says when the facts last changed.
      parameters:
        - in: query
          name: cursor
          description: Opaque cursor from a prior response's `next_cursor`. Omit for the newest page.
          schema: { type: string }
        - in: query
          name: page_size
          description: Stories per page, 1 to 50 on every tier (default 20). `limit` is accepted as an alias.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of stories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoriesPage" }
        "400": { description: Invalid cursor (opaque; reuse `next_cursor`), a `page_size` outside 1-50, or an unknown parameter (the body's `extra.allowed_params` lists the accepted ones). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ArchiveGated" }
        "404": { description: The Stories section is switched off. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/stories/{story_id}/:
    get:
      tags: [stories]
      summary: Get a story by its id
      description: |
        One story — the summary AlphAI wrote from its articles, the key facts
        each with the publisher it was read from and the `source_uid` of that
        article, the per-ticker read, the open questions — wrapped in a
        lookup `status`, because a `story_id` taken from an article row does
        not always name a current story:

        * `found` — `story` is filled.
        * `merged` — this story was folded into another one; `redirect_to`
          is the surviving story's id. Fetch that one (a web page would 308).
        * `not_a_story` — the id belongs to an article that only one
          publisher carried, so there is no story to summarise; `article`
          names it (`/api/news/{uid}/`). An article's `story_id` resolves
          here for every row, so this is the normal answer for most of the
          feed: most events are carried by a single outlet.
        * An unknown id is a 404.

        `summary_state` tells you how to read the text: `published` (the
        summary covers every article the story had when it was written),
        `stale` (`new_materials` articles joined since; the rewrite is
        queued — the summaries are debounced, so a fast-moving story is
        rewritten minutes, not seconds, after each new article), or
        `preparing` (no summary yet: `title` is the lead article's headline
        and `summary` its collector summary; `key_facts`, `why_it_matters`,
        `ticker_takes` and `uncertainties` are empty). A story older than
        your plan's archive horizon (by `last_material_at`) is a 403
        `archive_horizon`, like a deep feed cursor.

        The summary is the model's own text, checked against the articles
        before publishing: every figure in it appears in a source, and no
        passage of more than a dozen words is copied from one. It is
        AI-generated financial information for research, not investment
        advice. Article bodies are never served; `materials` link to the
        publishers.
      parameters:
        - in: path
          name: story_id
          required: true
          description: A story id — the `story_id` of any article row, or an id from `/api/stories/`.
          schema: { type: string, pattern: "^[a-f0-9]{16}$" }
      responses:
        "200":
          description: The lookup — `found`, `merged` or `not_a_story`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryLookup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ArchiveGated" }
        "404": { description: No story or article with that id, or the Stories section is switched off. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/stories/{story_id}/materials/:
    get:
      tags: [stories]
      summary: A story's articles (cursor-paginated)
      description: |
        Every article behind a story, oldest first — the materials the
        summary was written from and the ones that joined after it. Same
        visibility as the feed (`relevance_score >= 4`); each row carries its
        `uid` (open it with `/api/news/{uid}/`), publisher, publication time,
        the publisher's URL and its relevance score. A story's `key_facts`
        point into this list by `source_uid`. Keyset pagination with
        `cursor` / `next_cursor` as on `/api/stories/`; most stories fit one
        page. Only a current story (`status: found`) has materials: a merged
        or not-a-story id is a 404 here — resolve it through
        `/api/stories/{story_id}/` first.
      parameters:
        - in: path
          name: story_id
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{16}$" }
        - in: query
          name: cursor
          description: Opaque cursor from a prior response's `next_cursor`. Omit for the first (oldest) page.
          schema: { type: string }
        - in: query
          name: page_size
          description: Articles per page, 1 to 50 on every tier (default 50). `limit` is accepted as an alias.
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        "200":
          description: A page of the story's articles, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryMaterials" }
        "400": { description: Invalid cursor, a `page_size` outside 1-50, or an unknown parameter. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No current story with that id (merged and single-publisher ids included), or the Stories section is switched off. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/:
    get:
      tags: [symbols]
      summary: List active tickers
      description: >-
        All active symbols (US equities, US exchange-traded funds, crypto, and
        foreign listings), alphabetical by ticker. ~16k entries — cache
        aggressively, or slice with
        the optional `limit`/`offset` params (the response stays a bare array
        either way). Pass `search` to resolve a name, brand or ticker prefix to
        its canonical symbol (`search=bitcoin` returns `BTC-USD`,
        `search=spacex` returns `SPCX`).
      parameters:
        - in: query
          name: limit
          description: Return at most this many symbols. Omit for the full list.
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - in: query
          name: offset
          description: Skip this many symbols from the start of the list.
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: search
          description: >-
            Resolve a query to matching symbols: ticker-prefix, company-name
            substring, or the company's brand name where that differs from its
            registered name (`search=spacex` returns `SPCX`, registered as
            SPACE EXPLORATION TECHNOLOGIES CORP). Case-insensitive; exact
            ticker, exact name and brand matches rank above prefix and
            substring matches, and within the same level a company ranks above
            a fund (`search=jpmorgan` lists `JPM` before `JEPI`). Useful for
            finding the canonical form of a name (`search=bitcoin` returns
            `BTC-USD`).
          schema: { type: string, example: "bitcoin" }
      responses:
        "200":
          description: List of active symbols.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Symbol" }
        "400": { description: Out-of-range or unknown query parameter. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/{ticker}/:
    get:
      tags: [symbols]
      summary: Symbol detail
      parameters:
        - in: path
          name: ticker
          required: true
          description: >-
            Ticker symbol. US equities are bare (`AAPL`); cryptocurrencies use
            the `<SYM>-USD` form (`BTC-USD`); foreign listings use the Yahoo
            suffix (`VOD.L`).
          schema: { type: string, pattern: "^[A-Z0-9][A-Z0-9.\\-]{0,19}$", example: "BTC-USD" }
      responses:
        "200":
          description: >-
            Symbol with extended metadata. Resolves delisted symbols too:
            check `status`, and `renamed_to` for the successor ticker when
            the company continues under a new symbol.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Symbol" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/{ticker}/sentiment-summary/:
    get:
      tags: [symbols]
      summary: 7-day AI sentiment rollup for one ticker
      description: |
        Counts of bullish / neutral / bearish per-ticker sentiment calls from
        the enriched news flow, plus per-day buckets. The window is the last 7
        UTC calendar days, today included (today is partial): `daily` holds one
        bucket per day, and `bullish`, `neutral`, `bearish` and `total` are the
        sums of those buckets. Insider (SEC Form 4) template rows are excluded —
        this reflects press coverage, not filings.
      parameters:
        - in: path
          name: ticker
          required: true
          description: >-
            Accepts the same ticker forms as the symbol detail endpoint: bare
            crypto names resolve to their `<SYM>-USD` listing (`DOGE` →
            `DOGE-USD`; the response echoes the resolved ticker), and delisted
            or renamed symbols stay addressable.
          schema: { type: string, pattern: "^[A-Z0-9][A-Z0-9.\\-]{0,19}$" }
      responses:
        "200":
          description: >-
            Sentiment counts for the window. Zeros mean a quiet week for a
            real listing; a ticker no symbol owns returns 404 instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TickerSentimentSummary" }
        "400": { description: Malformed ticker. }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/{ticker}/insider-summary/:
    get:
      tags: [symbols]
      summary: 30-day insider-transaction rollup for one ticker
      description: |
        Aggregated SEC Form 4 activity over the trailing 30 days: buy/sell
        transaction counts, dollar volumes, the share of transactions executed
        under pre-arranged 10b5-1 plans, and the most active insiders ranked
        by absolute net value (buys minus sells).

        A co-filed block counts once. Section 16 makes each reporting person
        file: when a fund holds the shares and affiliated people are deemed
        beneficial owners of the same position, one trade arrives as two or
        three filings with identical shares and price. Counts, volumes and
        the insider ranking carry such a block once, under the direct holder;
        the beneficial owners' copies are left out (since 2026-11).
      parameters:
        - in: path
          name: ticker
          required: true
          description: >-
            Accepts the same ticker forms as the symbol detail endpoint: bare
            crypto names resolve to their `<SYM>-USD` listing, and delisted or
            renamed symbols stay addressable. Crypto and foreign listings have
            no Form 4 flow, so they return zeros.
          schema: { type: string, pattern: "^[A-Z0-9][A-Z0-9.\\-]{0,19}$" }
      responses:
        "200":
          description: >-
            Insider activity stats for the window. Zeros mean no filings in
            the window for a real listing; a ticker no symbol owns returns
            404 instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TickerInsiderSummary" }
        "400": { description: Malformed ticker. }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/{ticker}/earnings/:
    get:
      tags: [symbols]
      summary: AlphAI earnings reads for one ticker, plus its next report date
      description: |
        Every published AlphAI earnings read for the ticker, newest first, and
        the date of its next report when the source marks one as confirmed.

        A read is written by an LLM from the company's own SEC filing — an 8-K
        item 2.02 for US filers, a 6-K earnings release for foreign private
        issuers — within minutes of it reaching EDGAR. Every number in it is
        checked against the filing text before publication. A `key_metrics` or
        `segments` row holding a figure the filing does not print, or a
        `key_metrics` row whose value, prior period and printed change do not
        add up, is dropped, so a read can list fewer rows than the filing. If a
        figure elsewhere in the read still cannot be matched after a second
        attempt, the read is published with
        `numbers_verified_from_document: false`. The model can still misread a
        table, in the metrics or in the narrative fields: check a figure in the
        filing before acting on it. `/earnings/latest/` returns
        just a pointer to the newest one; this endpoint returns the analyses
        themselves.

        Bridges share classes: a request for one class returns the reads filed
        under the issuer's primary class, and each row's `ticker` names the
        class it was actually filed under, which may differ from the one you
        asked for.

        Unpaginated and capped at 20 reads. Depth is currently shallow by
        construction — AlphAI's reads exist for filings from late July 2026
        onward and reports arrive quarterly — so most tickers carry one or two.
      parameters:
        - in: path
          name: ticker
          required: true
          description: >-
            Accepts the same ticker forms as the symbol detail endpoint.
          schema: { type: string, pattern: "^[A-Z0-9][A-Z0-9.\\-]{0,19}$" }
      responses:
        "200":
          description: >-
            The ticker's earnings reads. An empty `reports` array is a normal
            answer, not an error: it means no read has been published yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TickerEarningsHistory" }
        "400": { description: Malformed ticker. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Unknown symbol — no listing owns this string (error code
            `unknown_symbol`). Look tickers up via `/api/symbols/?search=`.
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/{ticker}/earnings/latest/:
    get:
      tags: [symbols]
      summary: Most recent AlphAI earnings read for one ticker
      description: |
        A pointer to the ticker's most recent published earnings read (SEC 8-K
        item 2.02, or a foreign private issuer's 6-K earnings release). Resolve
        the full analysis via `/api/news/{uid}/`, whose
        `earnings` object carries it. Bridges share classes: a request for one
        class returns the read filed under the issuer's primary class.
      parameters:
        - in: path
          name: ticker
          required: true
          description: >-
            Accepts the same ticker forms as the symbol detail endpoint.
          schema: { type: string, pattern: "^[A-Z0-9][A-Z0-9.\\-]{0,19}$" }
      responses:
        "200":
          description: The ticker's most recent earnings read pointer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LatestEarningsPointer" }
        "204": { description: No earnings read exists for this ticker yet. }
        "400": { description: Malformed ticker. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Unknown symbol — no listing owns this string (error code
            `unknown_symbol`). Look tickers up via `/api/symbols/?search=`.
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/{ticker}/insider-trades/:
    get:
      tags: [symbols]
      summary: Form 4 event history and chart aggregates for one ticker
      description: |
        The complete per-ticker insider-trading payload behind
        alphai.io/stock/{ticker}/insider-trades: the paginated Form 4 event
        history plus everything a chart needs, in one request. One event is
        a filing's whole tranche group (shares summed, the price
        value-weighted, a 10b5-1 ladder is ONE event), same folding as the
        feed's `insider` block.

        The first page (no `cursor`) also carries the aggregates: `summary`
        (3-month, 12-month and all-time windows plus the most active
        insiders of the last 12 months), `series` (monthly buckets) and
        `series_weekly` (Monday-keyed weekly buckets), both zero-filled up
        to the current period and capped to the trailing 12 months, and
        `chart_events` — every event of the trailing 12 months regardless of
        pagination. The aggregates always cover both sides regardless of the
        `side` filter, and they are `null` on cursor pages, which carry only
        the next `events` chunk.

        Side semantics on this surface follow the value flow: code P is
        `buy`; codes S and D are both `sell`, because a code D sale back to
        the issuer moves dollars off the insider's position like any sale.
        This deliberately differs from the feed's `insider.side`, which
        labels D as `other`; use `transaction_code` to tell a market sale
        (S) from a sale to the issuer (D).

        A co-filed block counts once (since 2026-11). When the direct holder
        and each affiliated beneficial owner file their own Form 4 for the
        same trade, `events` still lists every filing — each is a real
        document — but the copies carry `duplicate_of` (the `news_uid` of the
        filing that counts) and are left out of `summary`, `series`,
        `series_weekly` and `chart_events`. `unique_insiders` keeps counting
        every reporting owner. Filter `duplicate_of == null` to reproduce the
        aggregates from the table, or ignore the field to count every filing.
      parameters:
        - in: path
          name: ticker
          required: true
          description: >-
            Accepts the same ticker forms as the symbol detail endpoint: bare
            crypto names resolve to their `<SYM>-USD` listing, and delisted or
            renamed symbols stay addressable. Crypto and foreign listings have
            no Form 4 flow, so they return empty history.
          schema: { type: string, pattern: "^[A-Z0-9][A-Z0-9.\\-]{0,19}$" }
        - in: query
          name: side
          description: >-
            Filters the paginated `events` list only; the first page's
            aggregates always cover both sides.
          schema: { type: string, enum: [buy, sell, all], default: all }
        - in: query
          name: cursor
          description: >-
            Opaque keyset cursor from a prior response's `next_cursor`. Omit
            it for the newest page, the only one carrying the aggregates.
          schema: { type: string }
        - in: query
          name: page_size
          description: >-
            Events per page. Not tier-gated: every tier may request up to
            200, so one request can load a chart's whole working set.
            `limit` is accepted as an alias.
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: >-
            One page of the event history. Empty arrays mean no recorded
            filings for a real listing; a ticker no symbol owns returns 404
            instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TickerInsiderTrades" }
        "400": { description: Malformed ticker, cursor or query parameter. }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/{ticker}/peers/:
    get:
      tags: [symbols]
      summary: Related tickers for one ticker
      description: |
        Other companies in the same industry (widening to the broader sector
        when the industry is thin) that carry recent enriched news, most
        recently covered first. Powers the "Related tickers" links on the stock
        hub pages.
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string, pattern: "^[A-Z0-9][A-Z0-9.\\-]{0,19}$" }
      responses:
        "200":
          description: >-
            Up to ten related tickers. A well-formed but unknown ticker, or one
            with no peers carrying recent news, returns an empty list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SymbolPeers" }
        "400": { description: Malformed ticker. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/directory/:
    get:
      tags: [symbols]
      summary: Stock directory — most-covered tickers and sector cards
      description: |
        The hub index behind /stocks: the globally most-covered tickers over
        the trailing window, plus one card per sector (size + its busiest
        names). Ranked by recent enriched-news coverage.
      responses:
        "200":
          description: Most-active tickers and sector cards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SymbolDirectory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/symbols/sectors/{slug}/:
    get:
      tags: [symbols]
      summary: One sector's most-covered tickers
      description: |
        The tickers in a sector (by slug, e.g. `financial-services`), ranked by
        recent enriched-news coverage. Powers the /stocks/{slug} sub-pages.
        Returns up to 500 index-eligible tickers per page, ordered by coverage
        descending then ticker. Increment `page` while `has_next` is true.
        `count` is the number on this page; `total_count` is the whole sector.
        A page beyond the end returns an empty `symbols` array and `has_next: false`.
        Rankings refresh periodically; this is a live directory, not a historical snapshot.
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
        - in: query
          name: page
          description: One-based sector page, 500 tickers per page.
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        "200":
          description: The sector and its most-covered tickers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectorSymbols" }
        "400": { description: Invalid page or unsupported query parameter. }
        "404": { description: Unknown sector slug. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/signals/snapshot/:
    get:
      operationId: getRadarSnapshot
      summary: Rank market or saved-watchlist news activity
      description: 'Descriptive news-activity ranking. Free delay 3600 seconds; Basic 900 seconds; Pro no added delay.
        Tier and watchlist owner come from authentication, never query parameters. The public API requires a Bearer
        API key and uses the normal request quotas. The whole snapshot, including supporting headlines and company
        names, is selected at or before wall-clock time minus the tier delay. Snapshots refresh every minute and are
        retained for three hours. Collection and enrichment add processing time. preview_reference_at is null in live
        mode; a frozen development preview uses that historical clock instead and explicitly reports freshness.mode=historical_preview.
        as_of is the actual selected cutoff. Only tickers with current-window news appear. snapshot_id identifies
        immutable content including public evidence metadata. freshness states the effective delay, generation time,
        source check time and latest enrichment observed. Missing history or a producer more than four minutes behind
        returns 503, never newer data in place of a delayed snapshot. watchlist_coverage separates known quiet names
        from names absent from the snapshot; absent does not mean an invalid symbol. Summary is scoped before search/ticker/sentiment/min_z
        filters and pagination; universe describes the entire stored snapshot. Null metrics stay null. Collection
        coverage is unverified; these calculations are not point-in-time backtests or confirmed alerts. Historical
        corrections can affect the model baseline. All responses: private, no-store. event_context reports separate
        SEC/insider availability, cutoff, generation time, age_seconds at the numeric cutoff (not HTTP time), and
        lookback windows. results[].event_context contains only that row''s issuer-CIK context: up to 3 recent 8-K/6-K
        filings over 7 days by filed_at and up to 3 open-market insider clusters over 30 days by known_at (the latest
        SEC filing time). Counts cover all eligible records; arrays contain the newest records. Each cluster includes
        up to 5 SEC evidence links, filings_count and evidence_truncated. 6-K coverage is selected ingested earnings
        releases only. Filings also carry news_uid, news_title, news_published and has_article for AlphAI article
        links. has_article means enrichment existed before the context cutoff; older snapshots default to false
        with null title/publication metadata. SEC URLs remain available as sec_url.
        Share classes with the same CIK share context, without changing news counts, scores, filters,
        ranking or row eligibility. No USD totals are reported. Context and its evidence follow the same tier delay
        and cursor; later corrections appear only in new snapshots. Context older than max_age_seconds=300 at the
        numeric cutoff is unavailable. Missing, disabled, stale or failed context does not fail news readings. Unavailable
        context has null row context; a row also has null context when it is absent from the context snapshot. Unsupported
        or unidentified issuers have explicit row status/reason and null counts. Supported issuers with no eligible
        stored records have zero counts. Available does not certify complete SEC coverage. Unknown or repeated query
        parameters are rejected.'
      security:
      - apiKey: []
      parameters:
      - name: window
        in: query
        required: false
        description: Window ending at as_of, not at wall-clock now.
        schema:
          default: 24h
          enum:
          - 4h
          - 24h
          title: Window
          type: string
      - name: scope
        in: query
        required: false
        description: market scans all tickers without a tier ticker cap. watchlist requires authentication and reads
          only the caller's existing saved symbols, matched exactly. An empty list returns no results. Existing watchlist
          entitlements apply (default Free 10, Basic/Pro unlimited); no separate Radar allowance.
        schema:
          default: market
          enum:
          - market
          - watchlist
          title: Scope
          type: string
      - name: market
        in: query
        required: false
        description: Filter within the selected scope; international includes all intl:* markets.
        schema:
          default: all
          enum:
          - all
          - us_equity
          - crypto
          - international
          title: Market
          type: string
      - name: ticker
        in: query
        required: false
        description: One exact ticker, case-insensitive. No alias expansion. Mutually exclusive with tickers.
        schema:
          default: ''
          maxLength: 32
          title: Ticker
          type: string
      - name: tickers
        in: query
        required: false
        description: Comma-separated exact symbols, case-insensitive. No tier ticker cap; request text is bounded
          to 16384 characters. Applied within scope, so it never bypasses watchlist ownership.
        schema:
          default: ''
          maxLength: 16384
          title: Tickers
          type: string
      - name: search
        in: query
        required: false
        description: Case-insensitive ticker substring for interactive search. Separate from exact ticker selection.
        schema:
          default: ''
          maxLength: 32
          title: Search
          type: string
      - name: sort
        in: query
        required: false
        description: score, stories (total), model_stories, sentiment or sentiment_change (current minus prior window).
          Missing values last; ties use total story count then ticker.
        schema:
          default: score
          enum:
          - score
          - stories
          - model_stories
          - sentiment
          - sentiment_change
          title: Sort
          type: string
      - name: order
        in: query
        required: false
        description: asc or desc (default). Missing metrics always remain last.
        schema:
          default: desc
          enum:
          - asc
          - desc
          title: Order
          type: string
      - name: sentiment
        in: query
        required: false
        description: all, positive (>0.15), negative (<-0.15), mixed (inclusive -0.15 through 0.15). Null metrics
          match only all.
        schema:
          default: all
          enum:
          - all
          - positive
          - negative
          - mixed
          title: Sentiment
          type: string
      - name: min_z
        in: query
        required: false
        description: Minimum descriptive activity score, not a confirmed candidate filter.
        schema:
          anyOf:
          - maximum: 8
            minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Min Z
      - name: limit
        in: query
        required: false
        description: Page size only, never a tier ticker cap. Follow next_cursor with the same filters and page size.
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - name: offset
        in: query
        required: false
        description: Legacy zero-based pagination without snapshot pinning. Prefer cursor; cannot combine a nonzero
          offset with cursor.
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - name: cursor
        in: query
        required: false
        description: Opaque signed next_cursor or previous_cursor. Pins the complete snapshot, filters, tier and watchlist
          membership/owner. A changed context, removed snapshot or replaced content returns 409; restart without cursor.
          Never edit the token.
        schema:
          default: ''
          maxLength: 4096
          title: Cursor
          type: string
      responses:
        '200':
          description: Eligible snapshot and effective access rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadarSnapshot'
        '400':
          description: Invalid, unknown or repeated parameter
        '401':
          description: Invalid authentication or watchlist requested without authentication
        '404':
          description: Radar is disabled
        '409':
          description: Cursor context changed or pinned snapshot expired; restart without cursor
        '503':
          description: No valid eligible snapshot; never substitutes newer data
        '429':
          description: Account burst or daily request quota reached; respect Retry-After
      tags:
      - radar

  /api/coverage/:
    get:
      tags: [coverage]
      summary: Coverage passport — what each data source holds, from when, with which caveats
      description: |
        One object per data source: `publisher_news` (the GDELT stream, RSS
        feeds and directly parsed publisher pages), `sec_form4`, `sec_form8k`, `sec_form6k`,
        `earnings_reads`, `earnings_schedule` and `economic_calendar`. Each
        carries its earliest and latest row, the last ingest time, the row
        count in the source's own unit, the collector's cadence, a history
        note saying where the history is thin, the known limits, and the
        per-plan archive horizon. Read this before backtesting or promising
        coverage downstream: `first_row_at` is the earliest row we hold, NOT
        the start of dense coverage — `history_note` says which months are
        thin (publisher news densified in June 2026; Form 4 before May 2026
        is an unenriched replay; 8-K history starts June 2026; 6-K and
        earnings reads start 2026-07-28).

        The passport is computed once a day (03:50 UTC) and served from a
        cache: `as_of` is when the counts were taken and `generated_at` when
        the payload was assembled, so both describe the computation, never
        the response. Rows may be up to a day newer than `last_row_at`. On a
        cold cache the first caller computes it (a few seconds); a concurrent
        caller gets `503` with `Retry-After` instead of a second scan.

        `stale` is an honest flag, not an alert: true when the newest ingest
        is older than `stale_after_seconds` — six poll cycles for the
        collectors, three days for SEC filings (EDGAR takes no filings on
        weekends), ten days for earnings reads — or, for the economic
        calendar (`stale_after_seconds` null), when no future occurrence is
        held. `publisher_news` additionally reports each discovery channel
        (`gkg`, `rss`) with its own last ingest and flag.
        `research_only` restates that everything described here is
        AI-generated financial information for research, not investment
        advice.
      responses:
        "200":
          description: The passport, one object per source in a fixed order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: >-
            The passport is not cached and another request is computing it.
            `Retry-After` (30 s) is when the fresh payload will be there; the
            body's `extra` carries `reason: coverage_unavailable` and
            `retry_after_seconds`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: ak_live_*
      description: |
        Token of the form `ak_live_<random>`. Issued from
        `/account/api-keys` on the website. Send as `Authorization: Bearer …`.

  responses:
    DeltaScanIncomplete:
      description: |
        A resumed JSON delta scan consumed its work allowance without finding
        visible rows or reaching the head. `extra.reason` is
        `delta_scan_incomplete`. Continue from `extra.next_cursor` with identical
        filters and sort; only invisible candidates were consumed. Do not retry
        the old cursor or treat this error as caught up. Existing SDK iterators
        raise a conflict error; applications must explicitly resume from the
        cursor in its `extra`. CSV follows these continuations internally.
      headers:
        Cache-Control:
          description: The incomplete scan must not be cached.
          schema: { type: string, example: "private, no-store" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            message: Delta scan reached its work limit. Continue with next_cursor and the same filters and sort.
            extra:
              reason: delta_scan_incomplete
              next_cursor: opaque-continuation-token
    DeltaCandidatesChanged:
      description: |
        Delta candidates changed between selection and reading. `extra.reason`
        is `delta_candidates_changed`; no continuation cursor is returned.
        Retry the original request with the same cursor and filters.
      headers:
        Cache-Control:
          description: The interrupted scan must not be cached.
          schema: { type: string, example: "private, no-store" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            message: Delta candidates changed during the scan. Retry with the original cursor and filters.
            extra:
              reason: delta_candidates_changed
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: |
        Rate limit exceeded — either the per-minute burst cap or the per-day
        volume cap. The `Retry-After` header is the earliest second a retry can
        succeed, not a guess (a burst
        block is short, ≤60s; a day-cap block is capped at 3600s — the true reset
        is `X-RateLimit-Reset`). The `X-RateLimit-*` trio shows the daily volume
        budget. The body's `extra` names your tier, its `limit_per_minute` /
        `limit_per_day`, `retry_after_seconds`, and — below Pro — an `upgrade`
        block with the higher tiers' caps and the pricing URL. A rejected
        request does not itself consume quota, so retrying after `Retry-After`
        costs you nothing extra.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (burst ≤60s; day cap ≤3600s).
          schema: { type: integer }
        X-RateLimit-Limit:
          description: The tier's per-day request volume.
          schema: { type: integer }
        X-RateLimit-Remaining:
          description: Requests left in today's volume budget.
          schema: { type: integer }
        X-RateLimit-Reset:
          description: Epoch seconds of the next 00:00 UTC reset.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No item with that identifier.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ArchiveGated:
      description: |
        The request reaches past your plan's news-archive horizon (Free 30
        days, Basic 90, Pro 180) — either the `cursor` points beyond it, or
        `from_date` does. The body's `extra` carries `reason: archive_horizon`,
        your `tier`, the plan's `archive_days`, and (below Pro) an `upgrade`
        block with the higher tiers' caps and the pricing URL.

        The window is checked on the FIRST page, unlike the cursor: a
        `from_date` older than the horizon is refused immediately rather than
        after paging down to it. A window with only `to_date` is refused when
        that bound itself is past the horizon (the window is open-ended into
        the past). Windows and cursors inside the horizon are unaffected, and
        the request is refused rather than trimmed to the horizon, so a given
        URL always returns the same body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RadarCalculationParams:
      properties:
        effective_at:
          title: Effective At
          type: integer
        window_seconds:
          title: Window Seconds
          type: integer
        baseline_seconds:
          title: Baseline Seconds
          type: integer
        half_life_seconds:
          title: Half Life Seconds
          type: integer
        min_relevance:
          title: Min Relevance
          type: integer
        max_story_tickers:
          title: Max Story Tickers
          type: integer
        prior_stories:
          title: Prior Stories
          type: number
        min_baseline_stories:
          title: Min Baseline Stories
          type: integer
        min_baseline_days:
          title: Min Baseline Days
          type: integer
        min_sentiment_stories:
          title: Min Sentiment Stories
          type: integer
        min_sentiment_coverage:
          title: Min Sentiment Coverage
          type: number
        spike_tail:
          title: Spike Tail
          type: number
      required:
      - effective_at
      - window_seconds
      - baseline_seconds
      - half_life_seconds
      - min_relevance
      - max_story_tickers
      - prior_stories
      - min_baseline_stories
      - min_baseline_days
      - min_sentiment_stories
      - min_sentiment_coverage
      - spike_tail
      title: RadarCalculationParams
      type: object
    RadarCollection:
      properties:
        status:
          enum:
          - healthy
          - unverified
          title: Status
          type: string
        reasons:
          items:
            type: string
          title: Reasons
          type: array
        required_channels:
          items:
            type: string
          title: Required Channels
          type: array
      required:
      - status
      - reasons
      - required_channels
      title: RadarCollection
      type: object
    RadarEvidence:
      properties:
        uid:
          title: Uid
          type: string
        title:
          title: Title
          type: string
        url:
          title: Url
          type: string
        source_domain:
