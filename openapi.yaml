    NewsCategory:
      type: string
      description: >-
        `market_movers` is for articles whose subject IS a notable price move
        ("AMD up 5% today"); `sector_analysis` is genuine sector-level
        analysis; `insider` covers SEC Form 4 insider transactions only.
        SEC 8-K filings categorize by their primary item: an earnings release
        (Item 2.02) is `earnings`, a completed acquisition or disposition
        (Item 2.01) is `mergers_acquisitions`, and the remaining events
        (material agreements, debt, executive changes, annual-meeting
        results, and since 2026-09-17 securities offerings, Regulation FD
        disclosures and other events under Items 7.01/8.01) are
        `corporate_actions`. A foreign private issuer's SEC 6-K
        appears only when it is an earnings release (`source` "SEC EDGAR
        6-K") and is always `earnings`.
      enum:
        - earnings
        - mergers_acquisitions
        - regulation
        - macro_economy
        - sector_analysis
        - market_movers
        - technology
        - commodities
        - crypto
        - ipo
        - geopolitics
        - insider
        - corporate_actions
        - other

    NewsSourceType:
      type: string
      description: >-
        Where a row was ingested from, the axis the `source_type` filter on
        `/api/news/` selects on. `gdelt` is press coverage (every publisher
        channel: the GDELT stream, RSS feeds, directly parsed publisher pages); `sec_form4`
        an insider transaction (`category` `insider`); `sec_form8k` an 8-K
        current report (carries the `filing` block, filterable by `item`);
        `sec_form6k` a foreign private issuer's 6-K earnings release. The
        row's `original.source` names the outlet or the SEC form in words.
      enum:
        - gdelt
        - sec_form4
        - sec_form8k
        - sec_form6k

    Sentiment:
      type: string
      enum: [positive, neutral, negative]

    CalendarEvent:
      type: object
      description: >-
        One scheduled occurrence of a US macro release. `uid` is a stable,
        opaque occurrence id — reschedules update the row in place, so the
        uid is safe to store and link. `phase` is computed against request
        time and only says whether the scheduled moment passed; check
        `schedule_status` first (a `cancelled` row's phase is meaningless).
      properties:
        uid: { type: string, example: "US-CPI-2026-07" }
        event_key:
          type: string
          enum:
            - fomc_decision
            - fomc_minutes
            - cpi
            - ppi
            - nfp
            - gdp
            - pce
            - retail_sales
            - jobless_claims
            - jolts
        title: { type: string, example: "CPI (Consumer Price Index)" }
        reference_period:
          type: string
          description: >-
            What the release covers, machine-readable: a month (`2026-07`), a
            quarter (`2026-Q2`), or — for weekly claims — the reference
            week-ending Saturday (`2026-07-25`).
          example: "2026-07"
        release_stage:
          type: string
          nullable: true
          description: GDP only — `advance`, `second` or `third`; null elsewhere.
        scheduled_at:
          type: string
          format: date-time
          description: Official release moment (UTC; 08:30 / 10:00 / 14:00 ET converted).
        phase: { type: string, enum: [upcoming, elapsed] }
        schedule_status: { type: string, enum: [scheduled, postponed, cancelled] }
        schedule_basis:
          type: string
          enum: [official, inferred]
          description: >-
            `official`: the date is printed on the agency's own schedule page.
            `inferred`: derived from the documented publication cadence —
            weekly jobless claims (DOL publishes no forward schedule) and FOMC
            minutes dates the Fed has not printed yet (three weeks after the
            meeting). Inferred dates flip to official once the agency lists
            them.
        importance: { type: string, enum: [high, medium, low] }
        category: { $ref: "#/components/schemas/NewsCategory" }
        country: { type: string, example: "US" }
        source_url:
          type: string
          format: uri
          description: The agency's own schedule page for the series.
        press_conference_at:
          type: string
          format: date-time
          nullable: true
          description: FOMC decisions only — the 14:30 ET press conference; null elsewhere.
        has_sep:
          type: boolean
          description: >-
            FOMC decisions only — true when the meeting carries a Summary of
            Economic Projections (the "dot plot").

    CalendarEvents:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/CalendarEvent" }

    EarningsCalendar:
      type: object
      required: [from_date, to_date, items]
      properties:
        from_date: { type: string, format: date, description: "First market day of the window." }
        to_date: { type: string, format: date, description: "Last market day of the window, exclusive." }
        items:
          type: array
          items: { $ref: "#/components/schemas/EarningsCalendarItem" }

    EarningsCalendarItem:
      type: object
      required: [ticker, listings, company, report_date, status]
      properties:
        ticker: { type: string, example: "MRNA" }
        listings:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
          example: [GOOG, GOOGL]
          description: "Sorted supported listings of this issuer, including ticker. Independent of the ticker filter; use these to match watchlist entries and deduplicate a report across batches. report_read.ticker still identifies the listing holding the read."
        company: { type: string, example: "Moderna, Inc." }
        sector: { type: string, nullable: true, example: "Healthcare" }
        report_date: { type: string, format: date, description: "New York market day: the date the source holds or, once we hold a read of the report, the day its filing landed." }
        session:
          type: string
          nullable: true
          enum: [before_open, after_close, null]
          description: Expected session when the source states one, never an exact time.
        status:
          type: string
          enum: [scheduled, reported]
          description: "`reported` once the company's SEC filing has landed."
        reported_at:
          type: string
          format: date-time
          nullable: true
          description: SEC acceptance time of the filing, once it has landed.
        previous_read:
          nullable: true
          description: With `detail=full`; can be null, and is on rows that come only from our reads.
          allOf: [{ $ref: "#/components/schemas/EarningsPreviousRead" }]
        report_read:
          nullable: true
          description: With `detail=full`; null until we hold a read of this report.
          allOf: [{ $ref: "#/components/schemas/EarningsReportRead" }]

    EarningsReportRead:
      type: object
      required: [uid, ticker, fiscal_period, published_at]
      properties:
        uid: { type: string, description: "Article uid of the filing.", example: "957b0c8575ed68bd" }
        ticker: { type: string, description: "The listing the read is filed under; `/api/symbols/{ticker}/earnings/` holds it.", example: "HUM" }
        fiscal_period: { type: string, description: "The period the report covers." }
        published_at: { type: string, format: date-time }
        verdict: { type: string, nullable: true, description: "Our read's verdict on the report." }

    EarningsPreviousRead:
      type: object
      required: [fiscal_period, published_at, what_to_watch]
      properties:
        fiscal_period: { type: string, description: "The period that report covered." }
        published_at: { type: string, format: date-time }
        verdict: { type: string, nullable: true, description: "Our read's verdict on that report." }
        guidance:
          type: object
          nullable: true
          required: [revenue]
          description: Revenue guidance the company gave in that report, as printed. Not an analyst estimate.
          properties:
            period: { type: string, nullable: true }
            revenue: { type: string, example: "$108.0 billion, plus or minus 2%" }
        what_to_watch:
          type: array
          maxItems: 3
          items: { type: string }

    Confidence:
      type: string
      enum: [high, medium, low]

    Actionability:
      type: string
      enum: [high, medium, low, negligible]

    Topic:
      type: object
      required: [topic, relevance]
      properties:
        topic: { type: string }
        relevance: { type: number, format: float }

    OriginalArticle:
      type: object
      description: The article as fetched from the source. `raw_text` is intentionally NOT exposed here.
      required: [uid, title, url, summary, time_published, source]
      properties:
        id: { type: integer }
        uid: { type: string, pattern: "^[a-f0-9]{16}$" }
        title: { type: string }
        url:
          type: string
          format: uri
          description: >-
            Where the article can be read: the publisher's own page. For a PR
            Newswire release (`source_domain` `prnewswire.com`) it is the
            release's permanent page on alphai.io with the licensed full text.
            For a Bloomberg row (`source_domain` `bloomberg.com`) it is the
            Bloomberg article, readable with a Bloomberg subscription.
        time_published: { type: string, format: date-time }
        authors:
          type: array
          items: { type: string }
          description: >-
            Article authors. On SEC Form 4 rows: every reporting owner of the
            filing, primary first — a joint filing by a holding vehicle and
            the person behind it lists both.
        summary:
          type: string
          description: >-
            AI-generated summary safe to redistribute. On a Bloomberg row it is a
            one-sentence restatement of the headline feed item, or the attributed
            headline itself when no restatement passed our checks.
        banner_image: { type: string, format: uri, nullable: true }
        source: { type: string }
        source_domain: { type: string }
        topics:
          type: array
          items: { $ref: "#/components/schemas/Topic" }
        tickers_sentiment:
          type: array
          items: { type: object, additionalProperties: true }
        ownership_form:
          type: string
          nullable: true
          enum: [direct, indirect]
          description: >-
            SEC Form 4 insider rows only — the holding pool the transaction
            touched. `null` for non-insider news. A single Form 4 can surface a
            `direct` and an `indirect` leg of the same plan as two separate
            articles (same filing URL, same date); they are distinct economic
            events, so SUM them rather than dedupe by URL/accession.
        created_at:
          type: string
          format: date-time
          description: >-
            When AlphAI received the article — NOT its publish time (that is
            `time_published`). Use it to judge how fresh a pickup is. Do not
            build "what's new" polling on this field; that is what
            `sort=ingested` on `/api/news/` and `/api/news/insider/` is for.
        updated_at:
          type: string
          format: date-time
          description: >-
