    EarningsReport:
      type: object
      description: >-
        AlphAI's own structured analysis of an earnings release (SEC Form 8-K
        item 2.02, or Form 6-K for a foreign private issuer — half-year and
        full-year periods, IFRS and non-USD figures copied as reported),
        written by an LLM. Every figure is checked against the filing text
        before storage. A `key_metrics` or `segments` row holding a figure the
        filing does not print, or a `key_metrics` row whose value, prior period
        and printed change do not add up, is dropped. If a figure elsewhere in
        the read still cannot be matched after a second attempt, the read is
        published with `numbers_verified_from_document: false`. A figure in the
        metrics or the narrative can still be misread. Consensus estimates and price targets are omitted because they
        are not in the filing. MCP `alphai_article` returns the structured read;
        connector `fetch` includes its metrics, comparisons, segments, guidance
        and limitations in the citation-ready `text` when a completed read exists.
      required: [company, ticker, fiscal_period, headline, verdict, key_metrics, analysis]
      properties:
        company: { type: string }
        ticker: { type: string }
        fiscal_period: { type: string, example: "Second Quarter Fiscal 2027" }
        period_end: { type: string, nullable: true }
        headline: { type: string }
        verdict: { type: string, enum: [strong, solid, mixed, weak] }
        verdict_reason: { type: string }
        key_metrics:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value:
                type: string
                example: "$96.2 billion"
                description: >-
                  The figure exactly as the filing printed it — this is the
                  string that was verified against the document, so a table in
                  millions arrives as `$19,345` and a press-release line as
                  `$6.76 billion`. Use the three companions below to compute.
              basis: { type: string, enum: [GAAP, non-GAAP, other] }
              prior_year: { type: string, nullable: true }
              prior_quarter: { type: string, nullable: true }
              yoy_change: { type: string, nullable: true }
              qoq_change: { type: string, nullable: true }
              numeric:
                type: number
                nullable: true
                example: 96.2
                description: >-
                  `value` as a number at the face scale it was printed, sign
                  applied (`$(5,396)` → -5396). Null when `value` carries no
                  figure. The amount in base units is `numeric` × the `scale`
                  multiplier (thousands 1e3, millions 1e6, billions 1e9).
              unit:
                type: string
                nullable: true
                example: USD
                description: >-
                  ISO-style currency code (`USD`, `EUR`, `TWD`, `CNY`, …),
                  `pct` for a percentage, `bp` for basis points, null for a
                  plain count (shares, units, multiples).
              scale:
                type: string
                nullable: true
                enum: [ones, thousands, millions, billions, trillions]
                description: >-
                  The multiplier `numeric` is expressed in. Filled only when
                  something in the filing says it: the printed value (`$6.76
                  billion`, `$60,801 (In millions)`), the metric name, the row's
                  own prior figure, the same amount printed with its unit in the
                  filing's prose, or the filing's table header when it names one
                  scale for its tables. Per-share and percentage figures are
                  `ones`; a per-unit metric (revenue per customer, a price per
                  ounce) never takes a table's scale. Null means the filing did
                  not say — treat `numeric` as unscaled at your own risk rather
                  than assume millions. Added 2026-09-12; the rules were
                  tightened and every stored read recomputed on 2026-10-01.
        segments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              revenue:
                type: string
                example: "$18,002"
                description: >-
                  The segment's figure exactly as the filing printed it. A
                  segment table names its unit in the header far more often than
                  in the cell, so use the three companions below to compute.
              yoy_change: { type: string, nullable: true }
              qoq_change: { type: string, nullable: true }
              driver: { type: string }
              numeric:
                type: number
                nullable: true
                example: 18002
                description: >-
                  `revenue` as a number at the face scale it was printed. Null
                  when the field carries no figure.
              unit:
                type: string
                nullable: true
                example: USD
                description: >-
                  ISO-style currency code, `pct` for a percentage, null when the
                  cell prints no currency (or holds a volume, such as units
                  delivered).
              scale:
                type: string
                nullable: true
                enum: [ones, thousands, millions, billions, trillions]
                description: >-
                  The multiplier `numeric` is expressed in, by the same rules as
                  a `key_metrics` row. A bare segment figure takes the table
                  header's scale only when the segments then fit under the
                  read's own revenue line; otherwise null. Added 2026-10-01 to
                  every stored read.
        guidance:
          type: object
          nullable: true
          properties:
            period: { type: string }
            revenue: { type: string, nullable: true }
            gross_margin: { type: string, nullable: true }
            operating_expenses: { type: string, nullable: true }
            tax_rate: { type: string, nullable: true }
            other: { type: array, items: { type: string } }
        vs_prior_guidance:
          type: array
          description: Reported figure vs the company's own prior outlook, when available.
          items:
            type: object
            properties:
              metric: { type: string }
              prior_guidance: { type: string }
              actual: { type: string }
              verdict: { type: string, enum: [above, "in line", below, "n/a"] }
        capital_returns: { type: array, items: { type: string } }
        balance_sheet_cash_flow: { type: array, items: { type: string } }
        drivers: { type: array, items: { type: string } }
        concerns: { type: array, items: { type: string } }
        what_to_watch: { type: array, items: { type: string } }
        quotes:
          type: array
          items:
            type: object
            properties:
              speaker: { type: string }
              role: { type: string, nullable: true }
              text: { type: string }
        analysis: { type: string, description: "Several paragraphs of grounded analysis." }
        missing_items:
          type: array
          items: { type: string }
          description: What the filing did NOT state, named rather than guessed.
        numbers_verified_from_document:
          type: boolean
          description: >-
            False when, after a second attempt, the read still holds a figure
            or a unit that could not be matched to the filing text, or the model
            itself reported one it could not confirm. Check such a read against
            the filing. True means the read passed the check, which allows one
            unmatched figure in the narrative of a first attempt; it does not
            mean each figure was read correctly.
        table_scale:
          type: string
          nullable: true
          enum: [thousands, millions, billions]
          description: >-
            The unit the filing's own table headers name (`(In millions, except
            per share data)`). The prose and list fields (`analysis`,
            `balance_sheet_cash_flow`, `capital_returns`, `concerns`, …) quote
            table figures as printed, so in a read with `table_scale: millions`
            a bare `$36,197` there is $36,197 million; per-share figures are
            always as printed. Null when the headers name no unit or name two
            without a clear majority. Added 2026-10-01 to every stored read.

    LatestEarningsPointer:
      type: object
      description: Pointer to a ticker's most recent earnings read (for the article link).
      required: [uid, time_published, title, fiscal_period, verdict, headline]
      properties:
        uid: { type: string, description: "Article uid; resolve the full read via /api/news/{uid}/." }
        time_published: { type: string, format: date-time }
        title: { type: string }
        fiscal_period: { type: string }
        verdict: { type: string, enum: [strong, solid, mixed, weak] }
        headline: { type: string }

    TickerEarningsReport:
      type: object
      description: One published AlphAI earnings read in a ticker's history.
      required: [uid, time_published, title, source_type, ticker, fiscal_period, analysis]
      properties:
        uid: { type: string, description: "Article uid; the same read is served inline by /api/news/{uid}/." }
        time_published: { type: string, format: date-time }
        title: { type: string, description: "The filing's own title." }
        source_type:
          type: string
          enum: [sec_form8k, sec_form6k]
          description: "`sec_form8k` for a US filer's item 2.02, `sec_form6k` for a foreign private issuer's earnings release."
        ticker:
          type: string
          description: >-
            The share class the filing was actually made under, which is not
            always the one requested — SEC-sourced rows tag one class per
            issuer, so a GOOGL request carries reads filed under GOOG.
        fiscal_period: { type: string, example: "Second Quarter Fiscal 2027" }
        analysis: { $ref: "#/components/schemas/EarningsReport" }

    TickerEarningsHistory:
      type: object
      required: [ticker, reports]
      properties:
        ticker: { type: string, description: "The requested ticker, normalized to upper case." }
        reports:
          type: array
          items: { $ref: "#/components/schemas/TickerEarningsReport" }
          description: Newest first, capped at 20. Empty when no read exists yet.
        next_report_date:
          type: string
          format: date
          nullable: true
          example: "2026-11-17"
          description: >-
            Same field, same rules, as `next_report_date` on the symbol detail
            response: the next report date the source marks as confirmed, in
            America/New_York, or `null` when AlphAI holds no confirmed one.
            Never an estimate.

    RichNewsArticle:
      type: object
      required: [original, enrichment]
      properties:
        original: { $ref: "#/components/schemas/OriginalArticle" }
        enrichment: { $ref: "#/components/schemas/EnrichedArticle" }
        search_match:
          allOf: [{ $ref: "#/components/schemas/SearchMatch" }]
          nullable: true
          description: >-
            Present only on `/api/news/search/` rows — how this article
            matched the query. `null` on every other endpoint.
        earnings:
          allOf: [{ $ref: "#/components/schemas/EarningsReport" }]
          nullable: true
          description: >-
            AlphAI's structured read of the company's SEC earnings filing
            (8-K item 2.02, or a foreign private issuer's 6-K earnings
            release). Present only on a major ticker's earnings article with a
            published read, null on every other article. Its figures are checked
            against the filing text; see `numbers_verified_from_document`.
        story_id:
          type: string
          nullable: true
          description: >-
            The story this article belongs to: a permanent key, the same value
            for a given story on every surface (`/api/news/`, search, trending,
            the MCP tools and `/api/stories/`) and across calls. Filled on
            every row of `/api/news/` and `/api/news/search/` since 1.49.0,
            and always on `/api/news/trending/`; a lone article is a story of
            one and names itself. The value is the `uid` of the story's first
            root article and does not change when a stronger copy later takes
            the root over or two stories merge (before 1.49.0 it followed the
            live root and could move once). Resolve it with
            `/api/stories/{story_id}/`: `found` is a story summarised from two
            or more publishers, `not_a_story` means one publisher carried the
            event (`/api/news/{uid}/` has the article), `merged` names the
            surviving story. `/api/news/{uid}/` carries it too; null only on
            `/api/news/{uid}/related/`. The `sources_count` / `sources` pair
            stays collapse-only.
          example: "788e477c66f3849b"
        sources_count:
          type: integer
          nullable: true
          description: >-
            Story-collapsed responses only. Number of distinct outlets (source
            domains) covering this story; the same outlet running it more than
            once counts once. Most stories are carried by a single outlet, so
            this is usually 1. Treat a value above 1 as the signal, not the
            number itself. May exceed the length of `sources`, which is capped
            at 10. `null` in the default feed.
          example: 3
        sources:
          type: array
          nullable: true
          items: { type: string }
          description: >-
            Story-collapsed responses only. Distinct source domains covering this
            story, in first-appearance order, capped at 10. `null` in the default
            feed.
          example: ["reuters.com", "apnews.com", "bloomberg.com"]
        insider:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/InsiderEvent" }]
          description: >-
            `/api/news/insider/` and `/api/news/{uid}/` — the structured SEC
            Form 4 event block, on every row whose source is a Form 4. `null`
            on every other row, on the other endpoints, and on rows without
            paired transaction data.
        filing:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/EightKFiling" }]
          description: >-
            `/api/news/` and `/api/news/{uid}/` — the structured SEC 8-K filing
            block, present on every row whose source is an 8-K
            (`original.source` is `SEC EDGAR 8-K`; filter them with
            `source_type=sec_form8k` or `item=`). `null` on press, Form 4 and
            6-K rows, on the other endpoints, and on the rare 8-K row without
            structured data.
        event:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CorporateEvent" }]
          description: >-
            `/api/news/`, `/api/news/search/` and `/api/news/{uid}/` — the
            typed corporate event the document reports, with facts quoted from
            its text. Present on SEC 8-K rows, 6-K earnings releases and PR
            Newswire releases (`original.source_domain` `prnewswire.com`) once
            the document has been read, usually within minutes of the row
            appearing; `null` until then, on every other row (press coverage,
            Form 4) and on the other endpoints. Filter with `event_type=`.

    StoryCard:
      type: object
      description: >-
        A story in a list (`/api/stories/top/`, `/api/stories/`): the
        summary's title and lead, the story's importance, breadth and timing.
      required:
        [story_id, title, summary, importance, category, tickers, publishers, materials,
         first_published_at, last_material_at, updated_at, summary_state]
      properties:
        story_id:
          type: string
          description: >-
            Permanent story key — the `uid` of the story's first root article;
            the same value article rows carry in their `story_id`. Opens
            `/api/stories/{story_id}/`.
          example: "788e477c66f3849b"
        title:
          type: string
          description: >-
            The summary's headline, written by AlphAI from the articles. In
            `preparing` state, the lead article's own headline.
        summary:
          type: string
          description: >-
            One paragraph: what happened, with the figures. In `preparing`
            state, the lead article's collector summary.
        importance:
          type: integer
          minimum: 1
          maximum: 10
          description: >-
            How much the event matters, on the feed's 1-10 relevance scale:
            the median of each publisher's best-scored article on the event,
            rounded down — so one outlet's 9 does not lift a story every other
            outlet scored 7. Stories below 7 are not listed and carry no
            summary.
        category:
          type: string
          description: The feed category of the story's root article (same 14 values as `enrichment.category`).
        tickers:
          type: array
          items: { type: string }
          description: Active tickers the story's articles are tagged with. Macro stories carry an empty list.
        publishers:
          type: integer
          description: Distinct publishers (source domains) covering the story — always 2 or more.
        materials:
          type: integer
          description: Articles in the story that the feed shows (`relevance_score >= 4`), reprints included.
        first_published_at:
          type: string
          format: date-time
          nullable: true
          description: Publication time of the story's earliest article.
        last_material_at:
          type: string
          format: date-time
          nullable: true
          description: Publication time of the story's latest article; `/api/stories/` is ordered by it.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the story's key facts last changed — a rewrite that only
            reworded the summary does not move it. The freshness Top stories
            rank by.
        summary_state:
          type: string
          enum: [published, stale, preparing]
          description: >-
            `published`: the summary covers every article the story had when
            it was written. `stale`: articles joined since; the rewrite is
            queued. `preparing`: no summary yet — the texts are the lead
            article's own.

    Story:
      description: >-
        The full story — a `StoryCard` plus the summary's body.
      allOf:
        - $ref: "#/components/schemas/StoryCard"
        - type: object
          required:
            [why_it_matters, key_facts, ticker_takes, uncertainties, based_on, materials_at_build,
             new_materials, revision_generated_at, indexable]
          properties:
            why_it_matters:
              type: string
              description: Why the event matters to the market, one short paragraph. Empty in `preparing` state.
            key_facts:
              type: array
              maxItems: 6
              items: { $ref: "#/components/schemas/StoryKeyFact" }
              description: Up to six facts, each attributed to the article it was read from.
            ticker_takes:
              type: array
              items: { $ref: "#/components/schemas/StoryTickerTake" }
              description: The read per ticker — direction and a one-line note.
            uncertainties:
              type: array
              items: { type: string }
              description: What the articles leave open or disagree on.
            based_on:
              type: integer
              description: >-
                Articles whose text the model read when writing the summary.
                Shown as "based on N of M sources" next to `materials_at_build`.
            materials_at_build:
              type: integer
              description: The story's visible article count when the summary was written.
            new_materials:
              type: integer
              description: Articles that joined after the summary was written (non-zero only in `stale` state).
            revision_generated_at:
              type: string
              format: date-time
              nullable: true
              description: When the published summary was written; `null` in `preparing` state.
            indexable:
              type: boolean
              description: >-
                Whether alphai.io lets search engines index this story's page
                (a published summary, `importance >= 8` and at least five
                publishers). Informational — it says nothing about the API's
                own access.

    StoryKeyFact:
      type: object
      required: [text, source_uid, publisher]
      properties:
        text:
          type: string
          description: The fact as the summary states it; every figure in it appears in the source article.
        source_uid:
          type: string
          description: >-
            The `uid` of the article the fact was read from — a row of
            `/api/stories/{story_id}/materials/`, openable with
            `/api/news/{uid}/`. Empty when that article has since been removed.
        publisher:
          type: string
          description: The source domain of that article.
          example: "reuters.com"

    StoryTickerTake:
      type: object
      required: [ticker, impact, note]
      properties:
        ticker: { type: string, example: "NVDA" }
        impact:
          type: string
          enum: [positive, negative, neutral]
          description: The summary's read of the event for this ticker — an editorial call, not a price label.
        note:
          type: string
          description: One line on why.

    StoryMaterial:
      type: object
      required: [uid, title, publisher, time_published, url, relevance_score, seo_eligible]
      properties:
        uid:
          type: string
          description: The article's uid — `/api/news/{uid}/` has the enriched row.
        title: { type: string }
        publisher:
          type: string
          description: Source domain.
          example: "apnews.com"
        time_published:
          type: string
          format: date-time
        url:
          type: string
          description: >-
            The publisher's own URL of the article. For a PR Newswire release
            (`publisher` `prnewswire.com`) it is the release's permanent page on
            alphai.io.
        relevance_score:
          type: integer
          minimum: 1
          maximum: 10
        seo_eligible:
          type: boolean
          description: >-
            Whether the article passes AlphAI's quality gate (relevance 7+,
            tickers, a news category, new information); the story page links
            such articles to their alphai.io page. Informational — the API
            serves every row regardless.

    StoryMaterials:
      type: object
      required: [story_id, results, next_cursor]
      properties:
        story_id: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/StoryMaterial" }
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next (newer) page; `null` at the end.

    StoriesPage:
      type: object
      required: [results, next_cursor]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/StoryCard" }
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next (older) page; `null` at the end.

    TopStories:
      type: object
      required: [results, as_of, ranking_version]
      properties:
        results:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/StoryCard" }
        as_of:
          type: string
          format: date-time
          description: When the list was ranked.
        ranking_version:
          type: integer
          description: The ranking formula's version; a change to the formula increments it.
          example: 1

    StoryArticleRef:
      type: object
      required: [uid, title, time_published]
      properties:
        uid: { type: string }
        title: { type: string }
        time_published: { type: string, format: date-time }

    StoryLookup:
      type: object
      description: >-
        What a story id resolves to. Exactly one of `story`, `redirect_to`
        and `article` is filled, according to `status`.
      required: [status]
      properties:
        status:
          type: string
          enum: [found, merged, not_a_story]
          description: >-
            `found`: `story` is filled. `merged`: this story was folded into
            another one, `redirect_to` is its id. `not_a_story`: the id
            belongs to an article only one publisher carried, `article`
            names it. (An unknown id is a 404, not a status.)
        story:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Story" }]
        redirect_to:
          type: string
          nullable: true
          description: The surviving story's id, when `status` is `merged`.
        article:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/StoryArticleRef" }]
          description: The single-publisher article the id belongs to, when `status` is `not_a_story`.

    EightKFiling:
      type: object
      description: >-
        Structured SEC 8-K filing: what the filing itself says, next to the
        AI read of it. One news row fronts one filing.
      required: [items, accession_number, filed_at]
      properties:
        items:
          type: array
          items: { type: string }
          description: >-
            Every item code the filing carries, in the filing's order
            (`["5.02", "9.01"]`). `?item=` matches any of them. Empty for a
            filing SEC served no document for (header-only).
          example: ["5.02", "9.01"]
        primary_item:
          type: string
          nullable: true
          description: >-
            The item that drove the row's `category` (`2.02` → `earnings`,
            `2.01` → `mergers_acquisitions`, the rest → `corporate_actions`).
            `null` when the filing lists no items.
          example: "5.02"
        accession_number:
          type: string
          description: SEC accession number of the filing — the id to cite.
          example: "0001193125-26-231145"
        filed_at:
          type: string
          format: date-time
          description: When EDGAR accepted the filing (UTC).
          example: "2026-09-18T20:05:12Z"
        event_date:
          type: string
          format: date
          nullable: true
          description: >-
            The filing's own "date of report" — the date of the event it
            reports, which can precede `filed_at` by up to four business days.
            `null` when the header carries none.
          example: "2026-09-16"
        exhibit_url:
          type: string
          format: uri
          nullable: true
          description: >-
            The press-release exhibit (EX-99.x) the summary was built from, on
            sec.gov. `null` when the filing has no such exhibit (the summary
            then reads the cover document).
          example: "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000123/ex99-1.htm"

    CorporateEventType:
      type: string
      description: >-
        What a document is about, first of all. One type per row; other events
        the same document reports are in `event.also`. `earnings` — a results
        release (its numbers are in the `earnings` block of the article, not
        here); `earnings_date` — the date of an upcoming report or call;
        `guidance_update` — an outlook raised, lowered, reaffirmed, withdrawn
        or initiated; `exec_change` — an officer or director appointed or
        leaving; `m_and_a` — an acquisition, merger or divestiture;
        `offering` — a sale of shares, units, warrants or convertible notes
        (dilution); `debt_financing` — a loan, credit facility or
        non-convertible notes; `dividend`; `buyback`; `contract_award` — a
        customer contract, order, licence or supply agreement; `stock_split`
        (forward or reverse); `listing_notice` — an exchange deficiency notice,
        regained compliance, delisting or transfer; `shareholder_vote` —
        results of a shareholder meeting; `bankruptcy`; `restructuring` —
        layoffs or an exit plan with charges; `clinical_regulatory` — trial
        data or a regulator's decision on a product; `other` — none of the
        above.
      enum:
        - earnings
        - earnings_date
        - exec_change
        - m_and_a
        - offering
        - debt_financing
        - dividend
        - buyback
        - contract_award
        - guidance_update
        - stock_split
        - listing_notice
        - shareholder_vote
        - bankruptcy
        - restructuring
        - clinical_regulatory
        - other

    CorporateEvent:
      type: object
      description: >-
        The corporate event an SEC 8-K, a 6-K earnings release or a PR
        Newswire release reports: a type, who the issuer is in it, and facts
        quoted from the document. Every quoted value is searched for in the
        document's text before it is published; a value that is not found
        there is withheld, and `verified` says whether that happened. A type
        settled by the 8-K item alone (`shareholder_vote` for item 5.07,
        `bankruptcy` for 1.03, `restructuring` for 2.05, `listing_notice` for
        3.01) has no facts. AI-generated from the document; check the filing
        before acting on a number.
      required: [type, facts, verified, also]
      properties:
        type: { $ref: "#/components/schemas/CorporateEventType" }
        stage:
          type: string
          nullable: true
          description: >-
            How far the event has gone, for `m_and_a` (`announced`,
            `definitive`, `completed`, `terminated`) and `offering`
            (`proposed`, `priced`, `closed`, `terminated`). A copy of the
            `stage` fact; `null` for the other types or when the document does
            not say.
          example: definitive
        role:
          type: string
          nullable: true
          enum: [issuer, acquirer, target, customer, supplier, other, null]
          description: >-
            The reporting company's side of the event: `acquirer` or `target`
            in a deal, `customer` or `supplier` in a contract, `issuer` for
            its own securities and corporate actions. `null` when not
            established.
          example: acquirer
        counterparty:
          type: string
          nullable: true
          description: >-
            The other party, as named in the document: the target when `role`
            is `acquirer`, the buyer when it is `target`, the customer or
            supplier of a contract. A copy of the `counterparty` fact; `null`
            when there is none or the name was not found in the text.
          example: "Bluevine Inc."
        facts:
          type: array
          items: { $ref: "#/components/schemas/CorporateEventFact" }
          description: >-
            The facts of the event, each quoted from the document. Which names
            can appear depends on `type` (see `CorporateEventFact.name`). May
            be empty: the type is published even when no fact could be quoted.
        verified:
          type: boolean
          description: >-
            `true` when nothing was withheld: every quoted fact was found in
            the document and every enumerated one is a known value. `false`
            when at least one fact was dropped by that check, or while the
            facts are still being read (the row then carries the type and an
            empty `facts`). The facts that ARE present have all passed the
            check either way.
        also:
          type: array
          items: { $ref: "#/components/schemas/CorporateSecondaryEvent" }
          description: >-
            Other events the same document reports, each with its own type and
            facts — typically a dividend, a buyback or a guidance change
            inside an earnings release. `event_type=` matches these too. Empty
            when the document reports one event.
      example:
        type: m_and_a
        stage: definitive
        role: acquirer
        counterparty: "Bluevine Inc."
        facts:
          - { name: deal_value, value: "$340 million", number: 340, number_high: null, unit: USD, scale: millions }
          - { name: consideration, value: mixed, number: null, number_high: null, unit: null, scale: null }
          - { name: expected_close, value: "early 2027", number: null, number_high: null, unit: null, scale: null }
        verified: true
        also: []

    CorporateSecondaryEvent:
      type: object
      description: >-
        Another event reported in the same document as the main one.
      required: [type, facts]
      properties:
        type: { $ref: "#/components/schemas/CorporateEventType" }
        facts:
          type: array
          items: { $ref: "#/components/schemas/CorporateEventFact" }
          description: The facts of this event, quoted from the document.
      example:
        type: dividend
        facts:
          - { name: amount_per_share, value: "$0.21", number: 0.21, number_high: null, unit: USD, scale: null }

    CorporateEventFact:
      type: object
      description: >-
        One fact of a corporate event. `value` is the document's own wording;
        the numeric fields are parsed from it by AlphAI, so a number is never
        further from the document than the quote beside it.
      required: [name, value]
      properties:
        name:
          type: string
          description: >-
            What the fact is. By event type — `exec_change`: `person_name`,
            `title`, `action`, `effective_date`, `successor_name`,
            `predecessor_name`; `m_and_a`: `counterparty`, `seller`,
            `deal_value`, `price_per_share`, `consideration`, `premium_pct`,
            `expected_close`, `stage`; `offering`: `instrument`,
            `gross_proceeds`, `shares`, `price_per_share`, `coupon_pct`,
            `maturity`, `upsized`, `use_of_proceeds`, `stage`;
            `debt_financing`: `instrument`, `amount`, `interest_rate`,
            `maturity`, `lender`; `dividend`: `amount_per_share`, `currency`,
            `frequency`, `kind`, `prior_amount_per_share`, `change_pct`,
            `record_date`, `payable_date`, `ex_date`; `buyback`:
            `authorization_amount`, `authorization_shares`,
            `prior_authorization_amount`, `is_increase`, `expires_at`,
            `pct_of_shares_outstanding`; `contract_award`: `counterparty`,
            `value`, `duration`, `scope`; `guidance_update`: `metric`,
            `period`, `new_value`, `prior_value`, `direction`; `stock_split`:
            `ratio`, `is_reverse`, `effective_date`; `listing_notice`:
            `exchange`, `kind`, `rule`; `restructuring`:
            `headcount_reduction`, `headcount_pct`, `charges`;
            `earnings_date`: `report_date`, `call_time`;
            `clinical_regulatory`: `product`, `milestone`, `indication`. A
            fact appears only when the document states it; percentages such as
            `premium_pct` or `pct_of_shares_outstanding` are never computed.
          example: deal_value
        value:
          type: string
          description: >-
            The fact as the document words it (`$25 billion`,
            `Dec. 21, 2026`, `one-month term SOFR plus 110 basis points`) —
            a quote, not a paraphrase. For the enumerated facts it is the
            normalized value instead: `action` is one of `appointed`,
            `elected`, `resigned`, `retired`, `terminated`, `interim`,
            `promoted`; `consideration` `cash`, `stock`, `mixed`; `direction`
            `raise`, `lower`, `reaffirm`, `withdraw`, `initiate`; `frequency`
            `quarterly`, `monthly`, `semi-annual`, `annual`, `one-time`;
            dividend `kind` `regular`, `special`, `initiation`, `increase`,
            `cut`, `suspension`; listing `kind` `deficiency`,
            `regained_compliance`, `delisting`, `transfer`, `uplisting`;
            `milestone` `topline_data`, `fda_approval`, `crl`, `pdufa_date`,
            `nda_submission`, `trial_start`, `discontinuation`; `stage` as
            listed on `CorporateEvent.stage`; `is_increase`, `is_reverse`,
            `upsized` `true` or `false`; `currency` a lowercase ISO code.
          example: "$340 million"
        number:
          type: number
          nullable: true
          description: >-
            The numeric value parsed from `value`, in the stated `scale`
            (`$340 million` → `340`, scale `millions`; `$0.21` → `0.21`). The
            low end when `value` is a range. `null` for text, dates and
            enumerated facts, and when the figure cannot be read without a
            guess.
          example: 340
        number_high:
          type: number
          nullable: true
          description: >-
            The high end when `value` is a range (`$6.50 to $6.90` → `number`
            `6.5`, `number_high` `6.9`), in the same `scale` as `number`
            (`$950 million to $1.1 billion` → `950` and `1100`, `millions`);
            `null` for a single value.
          example: null
        unit:
          type: string
          nullable: true
          description: >-
            Unit of `number`: an ISO 4217 currency code (`USD`, `EUR`, `GBP`,
            `CAD`, `AUD`, `CHF`, `HKD`, …), `percent` or `bps` (basis points);
            `null` when the value states none, as for a share count.
          example: USD
        scale:
          type: string
          nullable: true
          description: >-
            Multiplier the document states next to the figure: `thousands`,
            `millions`, `billions` or `trillions`. `null` means `number` is
            the full figure.
          example: millions

    InsiderEvent:
      type: object
      description: >-
        Structured SEC Form 4 event: the aggregate of the news row's whole
        transaction group (one row fronts a filing's non-derivative trades of
        one type and holding form, so a 10b5-1 ladder is ONE event). `shares`
        and `total_value_usd` are group sums; `avg_price_usd` is the
        value-weighted average over priced tranches. Money and share fields are
        decimal STRINGS to preserve precision.
      required:
        [side, transaction_code, shares, is_10b5_1, insider_name,
         insider_title, is_officer, is_director, is_ten_percent_owner,
         transaction_date, filed_at, late_filing]
      properties:
        side:
          type: string
          enum: [buy, sell, other]
          description: >-
            Signal label from the transaction code: `buy` (P, open-market
            purchase), `sell` (S, open-market sale), `other` for everything
            else — including D (sale to the issuer: a buyback/redemption, not
            an open-market disposition). Use `transaction_code` for your own
            mapping.
        transaction_code:
          type: string
          description: Raw SEC Form 4 transaction code (`P`, `S`, `D`, …).
          example: "S"
        shares:
          type: string
          description: Total shares across the event's tranches (decimal string).
          example: "25000"
        avg_price_usd:
          type: string
          nullable: true
          description: >-
            Value-weighted average price per share over priced tranches.
            `null` when the filing prices no tranche.
          example: "187.32"
        total_value_usd:
          type: string
          nullable: true
          description: >-
            Total USD value across priced tranches (a lower bound when some
            tranches are unpriced). `null` when no tranche is priced.
          example: "4683000"
        is_10b5_1:
          type: boolean
          description: >-
            True when any tranche executed under a pre-arranged 10b5-1 plan.
            Filterable on this endpoint: `?is_10b5_1=false` keeps the events
            not under a plan. For sales the insider chose to make, see
            `decision`.
        insider_name: { type: string, example: "STEVENS MARK A" }
        insider_title: { type: string, example: "Director" }
        is_officer: { type: boolean }
        is_director: { type: boolean }
        is_ten_percent_owner: { type: boolean }
        transaction_date:
          type: string
          format: date
          description: Date of the group's last fill (a ladder can span days).
          example: "2026-07-09"
        filed_at:
          type: string
          format: date-time
          description: >-
            When EDGAR accepted the filing (UTC). Compare against
            `transaction_date` for your own lateness rule.
          example: "2026-07-11T20:31:04Z"
        late_filing:
          type: boolean
          description: >-
            The filing missed the SEC's two-business-day deadline (Rule
            16a-3(g)). Computed on Eastern dates, since EDGAR accepts filings
            until ~22:00 ET, and with one weekday of slack so a trade in a
            holiday week is not flagged: true when more than three weekday-days
            separate `transaction_date` from the filing. About 3% of events
            carry it; the long tail is catch-up filings covering trades from
            years earlier.
        decision:
          type: string
          nullable: true
          enum: [discretionary, plan_like, unknown, null]
          description: >-
            Was the sale the insider's own decision? Read from the whole
            filing, in this order: the 10b5-1 checkbox; a footnote that names
            the mechanism (a plan, a tax sale on vesting, an exercise cover, a
            sale the insider did not control); then, for officers and for
            directors who are not 10% owners, the filing's own share arithmetic
            (what was sold against what vested or was exercised in the same
            filing). A sale none of these explains is `discretionary`.
            `discretionary`: the insider chose to sell. `plan_like`: the sale
            follows from a plan or from paperwork. `unknown`: the filing does
            not let us tell. An event with several sales is `discretionary` if
            any of them is, else `unknown` if any of them is, else
            `plan_like`. `null` when the event holds no sale (purchases, `D`
            and other codes are not labelled). The label can be revised when
            the reading rules improve: the feed always carries the current
            one, `sort=ingested` does not send a revised event again, and the
            single-article lookup `/api/news/{uid}/` is cached for long, so it
            can show an older label.
          example: "discretionary"
        decision_reason:
          type: string
          nullable: true
          enum:
            [plan_10b5_1, tax_withholding, exercise_cover,
             stated_non_discretionary, open_market, exercise_and_sell,
             sold_all_vested, partial_vest_sale, cover_ambiguous,
             mixed_acquisitions, price_disputed, no_lines, null]
          description: >-
            Why the event got its `decision`, taken from the largest sale that
            set it. With `plan_like`: `plan_10b5_1` (the 10b5-1 checkbox, or a
            footnote that places the sale under a pre-arranged plan, so it can
            appear with `is_10b5_1: false`), `tax_withholding` (shares sold to
            pay the tax on vesting), `exercise_cover` (the sale covers the cost
            of an option exercise and its tax), `stated_non_discretionary` (a
            footnote says the sale was automatic or outside the insider's
            discretion). With `discretionary`: `open_market` (no plan or
            paperwork explains the sale: nothing in the filing points to one,
            or the sale is far larger than what vested or was exercised),
            `exercise_and_sell` (options exercised and the exercised shares
            sold, beyond what covering the exercise needs), `sold_all_vested`
            (the shares sold plus those withheld for tax cover everything that
            vested). With `unknown`: `partial_vest_sale` (part of the newly
            vested shares sold, more than the tax alone would need, or on top
            of tax already withheld), `cover_ambiguous` (the sale could be an
            exercise cover at a high tax rate or a choice), `mixed_acquisitions`
            (the filing both vests shares and exercises options, so the sale
            cannot be tied to either), `price_disputed` (the filed price failed
            our price check, so the arithmetic is not trusted), `no_lines` (we
            do not hold the rest of the filing). `null` when `decision` is
            `null`, and for an `unknown` sale with no reason recorded.
          example: "open_market"

    NewsPagination:
      type: object
      required: [results, next_cursor]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/RichNewsArticle" }
        next_cursor:
          type: string
          nullable: true
          description: >-
            Opaque cursor for the next page. Pass it back as `?cursor=` with
            the same `sort` mode. Default (`sort=published`) feed: the next
            older page, `null` when the end of the feed has been reached.
            Delta mode (`sort=ingested`): always non-null — it is your polling
            position; empty `results` means caught up, keep the cursor and
            poll again later.
        symbol_note:
          type: string
          nullable: true
          example: >-
            'BTC' is Grayscale Bitcoin Mini Trust ETF (a stock/ETF ticker).
            The cryptocurrency with this symbol trades as BTC-USD — request
            BTC-USD for coin news.
          description: >-
            Crypto-collider hint, set only when `symbol` named a string a
            stock/ETF owns while an active cryptocurrency answers to the same
            base (crypto is addressed as `<SYM>-USD`, so `BTC` is the Grayscale
            ETF and `BTC-USD` the coin). One sentence naming the coin ticker to
            request; `null` for every other query. The page itself still serves
            the equity's feed — the string keeps its equity meaning.

    Symbol:
      type: object
      required: [symbol, name]
      properties:
        symbol: { type: string }
        name: { type: string }
        asset_type: { type: string, example: Stock, description: "`Stock`, `ETF`, or `Crypto`." }
        exchange:
          type: string
          example: NASDAQ
          description: >-
            TradingView exchange prefix. US: NYSE / NASDAQ / AMEX / OTC / CBOE
            (from SEC's exchange mapping). Foreign listings carry their venue
            prefix (LSE, XETR, EURONEXT, TSE, HKEX, KRX, …); crypto carries the
            `CRYPTO` sentinel. Empty string when unknown.
        sector: { type: string }
        industry: { type: string }
        description: { type: string }
        website: { type: string, format: uri, nullable: true }
        brand_aliases:
          type: array
          items: { type: string }
          description: >-
            Lowercase names the issuer is known by, when they differ from
            `name` (`["spacex"]` on SPCX, registered as SPACE EXPLORATION
            TECHNOLOGIES CORP). Use them to match a name a user typed against a
            ticker. Usually empty: most issuers are already reachable by their
            registered name. List responses only.
          example: ["spacex"]
        country:
          type: string
          description: >-
            ISO alpha-2 country of domicile. `US` for SEC-listed symbols, the
            listing venue's country for foreign listings. Empty for crypto — a
            coin has no domicile.
          example: US
        currency:
          type: string
          description: >-
            Trading currency. `USD` for SEC-listed symbols and crypto pairs, the
            local currency for foreign listings.
          example: USD
        next_report_date:
          type: string
          format: date
          nullable: true
          example: "2026-11-17"
          description: >-
            The next earnings date the source marks as confirmed, in
            America/New_York. Detail responses only.


            **Never an estimate**, though a company can still move the date. `null` means AlphAI holds no confirmed date
            — NOT that the company does not report. Confirmed dates typically
            surface about five weeks ahead, so `null` further out is the normal
            state, and coverage at any moment is partial. We deliberately do
            not fill the gap with a projection from the reporting cadence: a
            date nothing corroborates is indistinguishable downstream from one
            that does.


            Bridges share classes: a request for one class answers with the
            issuer's confirmed date whichever class it was filed under.
        supports_insider:
          type: boolean
          example: true
          description: >-
            Whether this symbol has SEC Form 4 insider data — true for
            US SEC-listed equities, false for exchange-traded funds (`asset_type`
            `ETF`), crypto and foreign listings.
            When false, `/insider-summary/` and `/insider-trades/` return
            empty rather than failing. Detail responses only.
        crypto_counterpart:
          type: string
          nullable: true
          example: SOL-USD
          description: >-
            When this symbol owns a bare string an ACTIVE cryptocurrency also
            answers to (delisted SOL = Emeren Group vs the coin SOL-USD, BTC =
            Grayscale ETF vs BTC-USD), the coin's ticker. `null` for symbols
            without an active crypto twin. Detail responses only.
        crypto_counterpart_name:
          type: string
          example: Solana
          description: >-
            Display name of `crypto_counterpart` (empty when it is null).
            Detail responses only.
        tv_symbol:
          type: string
          example: ""
          description: >-
            Per-symbol TradingView symbol override, when the venue-prefix rule
            built from `exchange` does not produce the right chart symbol.
            Empty for almost every row. Detail responses only.
        status:
          type: string
          example: active
          description: >-
            Listing status, `active` or `delisted`. Delisted symbols stay
            resolvable on this endpoint so their news history remains
            reachable.
        delisted_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the symbol was marked delisted. Null for active symbols and
            for symbols delisted before July 2026.
        renamed_to:
          type: string
          description: >-
            Set on a delisted symbol when the company continues under a new
            ticker (for example SATS became ECHO). Empty otherwise.

    SymbolPeer:
      type: object
      required: [ticker, name]
      properties:
        ticker: { type: string, example: "AMD" }
        name: { type: string, example: "Advanced Micro Devices Inc" }

    SymbolPeers:
      type: object
      required: [ticker, group, group_kind, peers]
      properties:
        ticker: { type: string }
        group:
          type: string
          description: Industry (or sector) label the peers share; empty if none.
          example: "Semiconductors"
        group_kind:
          type: string
          enum: ["industry", "sector", ""]
          description: Whether the peers were grouped by industry or the broader sector.
        peers:
          type: array
          items: { $ref: "#/components/schemas/SymbolPeer" }

    DirectorySymbol:
      type: object
      required: [ticker, name, news_count]
      properties:
        ticker: { type: string, example: "NVDA" }
        name: { type: string, example: "NVIDIA Corp" }
        news_count:
          type: integer
          description: Above-floor enriched-news rows mentioning the ticker in the window.

    DirectorySector:
      type: object
      required: [sector, slug, count, top]
      properties:
        sector: { type: string, example: "Technology" }
        slug: { type: string, example: "technology" }
        count:
          type: integer
          description: Total index-eligible symbols across all pages of the sector.
        top:
          type: array
          items: { $ref: "#/components/schemas/DirectorySymbol" }

    SymbolDirectory:
      type: object
      required: [most_active, sectors]
      properties:
        most_active:
          type: array
          items: { $ref: "#/components/schemas/DirectorySymbol" }
        sectors:
          type: array
          items: { $ref: "#/components/schemas/DirectorySector" }

    SectorSymbols:
      type: object
      required: [sector, slug, count, total_count, page, page_size, has_next, symbols]
      properties:
        sector: { type: string }
        slug: { type: string }
        count: { type: integer, description: Number of symbols on this page. }
        total_count: { type: integer, description: Total index-eligible symbols in the sector. }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, enum: [500] }
        has_next: { type: boolean }
        symbols:
          type: array
          items: { $ref: "#/components/schemas/DirectorySymbol" }

    TickerSentimentSummary:
      type: object
      required: [ticker, days, total, bullish, neutral, bearish, daily]
      properties:
        ticker: { type: string }
        days: { type: integer, example: 7 }
        total: { type: integer, description: Articles with a sentiment call in the window — the sum of the `daily` buckets. }
        bullish: { type: integer }
        neutral: { type: integer }
        bearish: { type: integer }
        daily:
          type: array
          items: { $ref: "#/components/schemas/DailySentimentBucket" }

    DailySentimentBucket:
      type: object
      required: [day, bullish, neutral, bearish]
      properties:
        day: { type: string, format: date }
        bullish: { type: integer }
        neutral: { type: integer }
        bearish: { type: integer }

    TickerInsiderSummary:
      type: object
      required: [ticker, days, total_transactions, buy_count, sell_count, pct_10b5_1, top_insiders]
      properties:
        ticker: { type: string }
        days: { type: integer, example: 30 }
        total_transactions: { type: integer }
        buy_count: { type: integer }
        sell_count: { type: integer }
        buy_value_usd:
          type: string
          nullable: true
          example: "1240000.00"
          description: Decimal string in USD; null when the window has no buys.
        sell_value_usd:
          type: string
          nullable: true
          example: "224580213.05"
          description: Decimal string in USD; null when the window has no sells.
        pct_10b5_1:
          type: integer
          minimum: 0
          maximum: 100
          description: Share of transactions executed under a pre-arranged 10b5-1 plan, in percent.
        top_insiders:
          type: array
          items: { $ref: "#/components/schemas/TopInsider" }

    TopInsider:
      type: object
      required: [name, title, transaction_count]
      properties:
        name: { type: string, example: STEVENS MARK A }
        title:
          type: string
          description: Officer title from the filing; empty when the filer reports as a director only.
        transaction_count: { type: integer }
        net_value:
          type: string
          nullable: true
          example: "-221102600.00"
          description: Buys minus sells in USD over the window, as a decimal string.

    TickerInsiderTrades:
      type: object
      required: [ticker, events, next_cursor]
      properties:
        ticker: { type: string }
        coverage_start:
          type: string
          format: date
          nullable: true
          description: >-
            Earliest recorded transaction date for this ticker; charts should
            not claim history from before it. `null` when nothing is recorded.
        summary:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/InsiderTradesSummary" }]
          description: First page only; `null` on cursor pages.
        series:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/InsiderTradesMonthBucket" }
          description: >-
            Calendar-month buckets, zero-filled up to the current month and
            capped to the trailing 12 months. First page only; `null` on
            cursor pages.
        series_weekly:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/InsiderTradesWeekBucket" }
          description: >-
            ISO-week buckets keyed by their Monday, zero-filled up to the
            current week over the same 12-month horizon. First page only;
            `null` on cursor pages.
        chart_events:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/InsiderTradeEvent" }
          description: >-
            Every event of the trailing 12 months, both sides, independent of
            the paginated list below — a chart never shows a bar without its
            marks. First page only; `null` on cursor pages.
        events:
          type: array
          items: { $ref: "#/components/schemas/InsiderTradeEvent" }
          description: One page of the event history, newest first; honors `side`.
        next_cursor:
          type: string
          nullable: true
          description: >-
            Opaque cursor for the next (older) page; `null` at the end of the
            recorded history.

    InsiderTradesSummary:
      type: object
      required: [last_3m, last_12m, all_time, top_insiders]
      properties:
        last_3m: { $ref: "#/components/schemas/InsiderTradesWindow" }
        last_12m: { $ref: "#/components/schemas/InsiderTradesWindow" }
        all_time: { $ref: "#/components/schemas/InsiderTradesWindow" }
        top_insiders:
          type: array
          items: { $ref: "#/components/schemas/InsiderTradesTopInsider" }
          description: Most active reporters of the last 12 months, at most five.

    InsiderTradesWindow:
      type: object
      description: >-
        Event-level aggregates over one rolling window. Counts here are
        grouped EVENTS, not tranches, so they run lower than the
        transaction counts of `/api/symbols/{ticker}/insider-summary/`.
      required: [buy_count, sell_count, unique_insiders, pct_10b5_1]
      properties:
        buy_count: { type: integer }
        sell_count: { type: integer }
        buy_value_usd:
          type: string
          nullable: true
          example: "1240000.00"
          description: Decimal string in USD; null when the window has no priced buys.
        sell_value_usd:
          type: string
          nullable: true
          example: "224580213.05"
          description: Decimal string in USD; null when the window has no priced sells.
        unique_insiders:
          type: integer
          description: Distinct reporting owners in the window.
        pct_10b5_1:
          type: integer
          minimum: 0
          maximum: 100
          description: Share of the window's events executed under a pre-arranged 10b5-1 plan, in percent.

    InsiderTradesTopInsider:
      type: object
      required: [name, title, event_count]
      properties:
        name: { type: string, example: "Intrator Michael N" }
        title:
          type: string
          description: Officer title from the filing; empty when the filer reports as a director only.
        event_count: { type: integer }
        net_value_usd:
          type: string
          nullable: true
          example: "-505000000.00"
          description: Buys minus sells in USD over the last 12 months, as a decimal string; positive means a net buyer.

    InsiderTradesMonthBucket:
      type: object
      required: [month, buy_count, sell_count, buy_value_usd, sell_value_usd]
      properties:
        month:
          type: string
          example: "2026-08"
          description: Calendar month, `YYYY-MM`.
        buy_count: { type: integer }
        sell_count: { type: integer }
        buy_value_usd:
          type: string
          example: "0"
          description: Decimal string in USD; `"0"` for a quiet side.
        sell_value_usd: { type: string, example: "48200000.00" }

    InsiderTradesWeekBucket:
      type: object
      required: [week_start, buy_count, sell_count, buy_value_usd, sell_value_usd]
      properties:
        week_start: { type: string, format: date, description: Monday of the ISO week. }
        buy_count: { type: integer }
        sell_count: { type: integer }
        buy_value_usd: { type: string, example: "0" }
        sell_value_usd: { type: string, example: "9886021.65" }

    InsiderTradeEvent:
      type: object
      description: >-
        One Form 4 economic event, same folding as the feed's `InsiderEvent`
        (a filing's whole tranche group: `shares` and `total_value_usd` are
        group sums, `avg_price_usd` is value-weighted over priced tranches,
        money and share fields are decimal STRINGS). Differences from the
        feed block: `side` here is only `buy` or `sell` (D counts as sell,
        see the endpoint description), and each event adds its stake impact,
        tranche count and the link to our enriched article.
      required:
        [side, transaction_code, ownership_form, shares, tranche_count,
         is_10b5_1, late_filing, insider_name, insider_title, is_officer,
         is_director, is_ten_percent_owner, transaction_date, filed_at,
         news_uid, news_title, news_published, has_article]
      properties:
        side:
          type: string
          enum: [buy, sell]
          description: Value-flow label; `transaction_code` carries the raw code.
        transaction_code:
          type: string
          description: Raw SEC Form 4 transaction code (`P`, `S`, `D`).
          example: "S"
        ownership_form:
          type: string
          enum: [D, I]
          description: Direct or indirect holding pool.
        security_title:
          type: string
          description: Security class from the filing; empty when unreported.
          example: "Common Stock"
        shares:
          type: string
          description: Total shares across the event's tranches (decimal string).
          example: "107692"
        avg_price_usd:
          type: string
          nullable: true
          description: >-
            Value-weighted average price per share over priced tranches.
            `null` when the filing prices no tranche.
          example: "91.80"
        total_value_usd:
          type: string
          nullable: true
          description: >-
            Total USD value across priced tranches (a lower bound when some
            tranches are unpriced). `null` when no tranche is priced.
          example: "9886021.65"
        tranche_count:
          type: integer
          description: Fills folded into this event (a 10b5-1 ladder files many).
          example: 8
        stake_change_pct:
          type: string
          nullable: true
          description: >-
            Percent of the pre-event position this event moved, as a decimal
            string; sells are negative ("-26.0" = sold 26% of the stake).
            `null` when the pre-event position cannot be reconstructed.
          example: "-100.0"
        is_10b5_1:
          type: boolean
          description: True when any tranche executed under a pre-arranged 10b5-1 plan.
        decision:
          type: string
          nullable: true
          enum: [discretionary, plan_like, unknown, null]
          description: >-
            The sale label, folded exactly like the feed's
            `InsiderEvent.decision`. `null` for an event without a sale
            (`transaction_code` `P` or `D`: a sale to the issuer counts as
            `sell` on this page but is not labelled).
          example: "plan_like"
        decision_reason:
          type: string
          nullable: true
          enum:
            [plan_10b5_1, tax_withholding, exercise_cover,
             stated_non_discretionary, open_market, exercise_and_sell,
             sold_all_vested, partial_vest_sale, cover_ambiguous,
             mixed_acquisitions, price_disputed, no_lines, null]
          description: >-
            Why the event got its `decision`; the same values and meanings as
            the feed's `InsiderEvent.decision_reason`.
          example: "tax_withholding"
        late_filing:
          type: boolean
          description: >-
            The filing missed the SEC's two-business-day deadline, computed
            the same way as the feed's `InsiderEvent.late_filing`.
        insider_name: { type: string, example: "Intrator Michael N" }
        insider_title: { type: string, example: "CEO and President" }
        is_officer: { type: boolean }
        is_director: { type: boolean }
        is_ten_percent_owner: { type: boolean }
        transaction_date:
          type: string
          format: date
          description: Date of the group's last fill (a ladder can span days).
          example: "2026-08-04"
        filed_at:
          type: string
          format: date-time
          description: When EDGAR accepted the filing (UTC).
          example: "2026-08-07T00:36:56Z"
        news_uid:
          type: string
          description: >-
            Uid of the enriched news row fronting this event; matches
            `original.uid` in the feeds.
        news_title: { type: string }
        news_published:
          type: string
          format: date-time
          description: Publish time of the fronting news row.
        has_article:
          type: boolean
          description: >-
            Whether the alphai.io article page for `news_uid` exists. Events
            ingested by the historical backfill have no enriched article;
            render those without a link.
        duplicate_of:
          type: string
          nullable: true
          description: >-
            Set when another filing reported the same block (the direct holder
            and each affiliated beneficial owner file their own Form 4 for one
            trade): the `news_uid` of the event that carries the block in
            `summary`, `series`, `series_weekly` and `chart_events`. This row
            stays in `events` as the real filing it is. `null` on every event
            that counts.
          example: null

    Error:
      type: object
      properties:
        message: { type: string }
        error: { type: string }
        detail: { type: string }
        extra:
          type: object
          description: >-
            Machine-readable context on capped responses: the 429 carries
            `tier`, `limit_per_minute`, `limit_per_day`, `retry_after_seconds`;
            the archive 403 carries `reason: archive_horizon`, `tier`,
            `archive_days`. Both include an `upgrade` object (higher tiers'
            caps + `pricing_url`) for callers below Pro.
            A 400 caused by an unknown query parameter additionally carries
            `allowed_params` — the complete list this endpoint accepts, read
            straight off the endpoint's own schema — plus `docs`, a link to the
            developer reference. Individual entries in `extra.fields` may carry
            a did-you-mean hint in their `msg`.

    Coverage:
      type: object
      required: [generated_at, as_of, research_only, sources]
      properties:
        generated_at:
          type: string
          format: date-time
          description: When the cached payload was assembled (UTC).
        as_of:
          type: string
          format: date-time
          description: >-
            The instant the counts were taken (UTC). Up to a day older than
            the response — the passport is recomputed daily, not per request.
        research_only:
          type: boolean
          description: Always `true`. Research information, not investment advice.
        sources:
          type: array
          items: { $ref: "#/components/schemas/CoverageSource" }
          description: >-
            Fixed order: publisher_news, sec_form4, sec_form8k, sec_form6k,
            earnings_reads, earnings_schedule, economic_calendar. A source with
            no rows is still present, with null dates and `rows_total: 0`.

    CoverageSource:
      type: object
      required: [source, rows_total, cadence, history_note, limits, stale]
      properties:
        source:
          type: string
          enum:
            - publisher_news
            - sec_form4
            - sec_form8k
            - sec_form6k
            - earnings_reads
            - earnings_schedule
            - economic_calendar
        first_row_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Earliest row by the source's own clock (article publish time,
            filing acceptance time, scheduled date at 00:00 UTC). The earliest
            row we hold, NOT the start of continuous coverage — see
            `history_note`.
        last_row_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Latest row by the same clock. For `earnings_schedule` and
            `economic_calendar` this reaches into the future (scheduled dates).
        last_ingested_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Arrival clock: when the newest row landed (`created_at`); for
            `earnings_schedule` the sync's last touch, for `economic_calendar`
            the last change to the calendar.
        rows_total:
          type: integer
          description: >-
            Rows in the source's own unit: articles for `publisher_news`,
            distinct filings (accession numbers) for `sec_form4`, filings for
            `sec_form8k` / `sec_form6k`, published reads for `earnings_reads`,
            confirmed dates for `earnings_schedule`, occurrences for
            `economic_calendar`.
        cadence:
          type: string
          description: How and how often the source is collected, in plain words.
        history_note:
          type: string
          description: >-
            Where the history is thin or starts: the caveat you would otherwise
            discover by probing the feed.
        limits:
          type: array
          items: { type: string }
          description: Known scope limits of the source (what is deliberately not collected).
        archive_days:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CoverageArchiveDays" }]
          description: >-
            How far back a key on each plan can page the news feeds into this
            source's rows; `null` where the archive gate does not apply
            (`earnings_reads`, `earnings_schedule`, `economic_calendar` are
            served by endpoints that page back freely).
        stale:
          type: boolean
          description: >-
            `true` when `last_ingested_at` is older than `stale_after_seconds`,
            or — for `economic_calendar`, where `stale_after_seconds` is null —
            when no future occurrence is held. An honest flag, not an alert.
        stale_after_seconds:
          type: integer
          nullable: true
          description: >-
            The horizon `stale` keys on: six poll cycles for the collectors,
            three days for SEC filings, ten days for earnings reads; `null`
            for the economic calendar.
        channels:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/CoverageChannel" }
          description: Only on `publisher_news` — the two discovery channels.

    CoverageChannel:
      type: object
      required: [channel, cadence, stale_after_seconds, stale]
      properties:
        channel:
          type: string
          enum: [gkg, rss]
        cadence: { type: string }
        last_ingested_at:
          type: string
          format: date-time
          nullable: true
        stale_after_seconds: { type: integer }
        stale: { type: boolean }

    CoverageArchiveDays:
      type: object
      required: [free, basic, pro]
      properties:
        free: { type: integer, description: "Days; 0 means unlimited." }
        basic: { type: integer }
        pro: { type: integer }

    InsiderClustersPage:
      type: object
      required: [results, next_cursor, meta]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/InsiderCluster" }
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page (pass back with the same `sort`); `null` at the end.
        meta: { $ref: "#/components/schemas/InsiderClustersMeta" }

    InsiderClustersMeta:
      type: object
      required: [as_of, coverage_since, episode_gap_days, episode_max_days, research_only, point_in_time]
      properties:
        as_of:
          type: string
          format: date-time
          description: When the underlying computation ran (the list is refreshed every few minutes).
        coverage_since:
          type: string
          format: date
          nullable: true
          description: Earliest purchase date on record; nothing before it can appear.
        episode_gap_days: { type: integer, example: 10 }
        episode_max_days: { type: integer, example: 30 }
        research_only: { type: boolean, example: true }
        point_in_time: { type: boolean, example: false }

    InsiderCluster:
      type: object
      description: >-
        One issuer's run of Form 4 purchases and its verdict. Money fields are
        decimal STRINGS. `buyers` counts independent buyers (the cluster);
        `buyers_total` everyone who bought, including plan, unpriced and
        duplicate reporters.
      required:
        [ticker, name, cik, window_start, window_end, known_at, buyers,
         buyers_total, officer_director_buyers, ten_percent_owner_buyers,
         fills, filings, total_usd, value_partial, distinct_dates,
         distinct_prices, pattern, pattern_reasons, buyers_detail,
         filings_detail]
      properties:
        ticker: { type: string, example: "AMRZ" }
        name: { type: string, example: "Amrize Ltd" }
        cik: { type: integer, description: SEC Central Index Key of the issuer. }
        window_start: { type: string, format: date, description: First purchase date of the episode. }
        window_end: { type: string, format: date, description: Last purchase date of the episode. }
        known_at:
          type: string
          format: date-time
          description: When the episode's latest filing reached EDGAR — the clock `days` is measured on.
        buyers: { type: integer, description: Independent buyers. }
        buyers_total: { type: integer, description: Every distinct reporting owner after duplicate merging. }
        officer_director_buyers: { type: integer, description: Independent buyers who are an officer or director. }
        ten_percent_owner_buyers: { type: integer, description: Independent buyers flagged as 10% owners. }
        fills: { type: integer, description: Purchase tranches counted (a transaction reported twice is counted once). }
        filings: { type: integer, description: Distinct Form 4 filings. }
        total_usd:
          type: string
          nullable: true
          description: Sum of the counted tranches' values (decimal string); `null` when no tranche carries a price.
        value_partial:
          type: boolean
          description: "`true` when at least one counted tranche has no price, so `total_usd` understates the episode."
        distinct_dates: { type: integer }
        distinct_prices: { type: integer, description: Distinct prices to the cent across priced tranches. }
        pattern:
          type: string
          enum: [open_market, plan_or_offering, holders_only]
        pattern_reasons:
          type: array
          items: { type: string }
          description: >-
            Machine-readable notes behind the verdict, e.g.
            `mass_uniform_date_price`, `same_price_across_dates`,
            `one_price_multi_date`, `plan_like_buyers`, `off_market_buyers`
            (a buyer whose filing says placement / offering / private),
            `unpriced_buyers`, `duplicate_filings`, `no_officer_or_director`.
        buyers_detail:
          type: array
          items: { $ref: "#/components/schemas/ClusterBuyer" }
        filings_detail:
          type: array
          items: { $ref: "#/components/schemas/ClusterFiling" }

    ClusterBuyer:
      type: object
      required: [name, title, is_officer, is_director, is_ten_percent_owner, role, reason, duplicate_of, fills, usd, first_date, last_date, news_uids]
      properties:
        name: { type: string, example: "Jenisch Jan Philipp" }
        title: { type: string, example: "Chairman & CEO" }
        is_officer: { type: boolean }
        is_director: { type: boolean }
        is_ten_percent_owner: { type: boolean }
        role:
          type: string
          enum: [independent, plan_like, unpriced, duplicate_of]
          description: >-
            `independent` counts toward the cluster. `plan_like`: the buyer's
            fills all share an exact date-and-price pair with another buyer's
            (an allocation, an ESPP/DRIP lot), match another direct holder's
            lot at a round price, or the filing itself says the shares were
            not bought on the open market (then `reason` is set). `unpriced`:
            no fill carries a price (units, exchanges). `duplicate_of`: the
            same transaction another reporter already reported; `duplicate_of`
            names that reporter.
        reason:
          type: string
          nullable: true
          enum: [placement, offering, private, null]
          description: >-
            Set on a `plan_like` buyer when the Form 4's own footnotes or
            remarks decided it: `placement` — bought from the issuer (a PIPE,
            a subscription or securities purchase agreement, SPAC sponsor
            units); `offering` — allocated in a public offering or IPO;
            `private` — a negotiated block from another holder (a stock
            transfer agreement, a private transaction). Null when the price
            shape alone decided the role. Read by the collector since
            2026-09-26; earlier filings are backfilled for 90 days.
        duplicate_of: { type: string, nullable: true }
        fills: { type: integer }
        usd: { type: string, nullable: true, description: Sum of this buyer's priced fills (decimal string). }
        first_date: { type: string, format: date }
        last_date: { type: string, format: date }
        news_uids:
          type: array
          items: { type: string }
          description: The `uid`s of the insider news rows fronting this buyer's filings — fetch `/api/news/{uid}/` for the event.

    ClusterFiling:
      type: object
      required: [accession_number, filed_at, sec_url]
      properties:
        accession_number: { type: string, example: "0002035989-26-000078" }
        filed_at: { type: string, format: date-time }
        sec_url: { type: string, format: uri, description: The filing's EDGAR index page. }

    SearchMatch:
      type: object
      description: How an article matched a `/api/news/search/` query.
      properties:
        score:
          type: number
          description: >-
            The engine's ranking score for this row. Comparable within one
            response only, never across queries or engine versions.
        terms_matched:
          type: integer
          nullable: true
          description: >-
            In `broadened` mode, how many of the query's words this row
            carries (at least two); `null` in `strict` mode, where every word
            matched.
        context:
          type: string
          nullable: true
          description: >-
            A fragment of the summary around the matched words, each wrapped
            in `**…**`; `null` when the match lies in the title or the entity
            names only.
    NewsSearchQueryInfo:
      type: object
      description: How `/api/news/search/` read the query.
      required: [mode, sort, terms]
      properties:
        mode:
          type: string
          enum: [strict, broadened, no_match, no_terms]
          description: See the endpoint description.
        sort:
          type: string
          enum: [relevance, published]
          description: >-
            `relevance` (ranked) or `published` (newest first) — the latter
            when every word is too common to rank on.
        terms:
          type: array
          items: { type: string }
          description: The normalized words that were searched.
        required_terms:
          type: array
          items: { type: string }
          description: >-
            In `broadened` mode, the words at least one of which every row
            carries, when the search reports them; empty otherwise (the
            current engine does not — `search_match.terms_matched` on each
            item is the count to trust).
        optional_terms:
          type: array
          items: { type: string }
        window_from:
          type: string
          format: date-time
          nullable: true
          description: Start of the searched window (your archive horizon, or `from_date` if later).
        note:
          type: string
          description: One sentence for an agent to act on — what selected the rows, and what they are not.
    NewsSearchPage:
      type: object
      required: [results, count, matched, query]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/RichNewsArticle" }
          description: Feed items in rank order, each with `search_match`.
        next_cursor:
          type: string
          nullable: true
          description: Pass back as `cursor` for the next page; `null` past the 200-match bound.
        count:
          type: integer
          description: Items on this page.
        matched:
          type: integer
          description: Visible matches in the bounded candidate set (at most 200); never a global total.
        query: { $ref: "#/components/schemas/NewsSearchQueryInfo" }
